<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meltdown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=block">
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  #panel { width: 240px; display: grid; gap: 8px; align-content: start; }
  canvas { max-width: min(100%, 720px); max-height: 90vh; }
  button, select { font: inherit; padding: 6px; }
</style>
</head>
<body>
<div id="panel">
  <select id="aspect">
    <option value="1080x1350">4:5</option>
    <option value="1080x1920">9:16</option>
    <option value="1080x1080">1:1</option>
  </select>
  <button id="play">▶ 音を鳴らす</button>
  <label>録画秒数 <input type="number" id="dur" min="3" max="60" value="15"></label>
  <button id="rec">● 録画して保存</button>
</div>
<canvas id="c"></canvas>

<script>
// 自分自身のソースコードを色分けして並べ、変位場で少しずつ運んで溶かす。色は文字と一緒に動く
const SRC = document.currentScript.textContent;
const c = document.getElementById('c'), ctx = c.getContext('2d');
const CW = 20, CH = 28;   // 1文字のマス（px）。1080 幅で 54 列
let W, H, COLS, ROWS, ch, st, ch2, st2, gone;   // ch: 文字コード - 32、st: スタイル番号（元のコード）。ch2/st2 は画面に出す分、gone は消したマス
const setSize = () => {
  [W, H] = document.getElementById('aspect').value.split('x').map(Number);
  c.width = W; c.height = H; COLS = W / CW | 0; ROWS = Math.ceil(H / CH);
  [ch, st, ch2, st2, gone] = [0, 0, 0, 0, 0].map(() => new Uint8Array(COLS * ROWS));
  reset();
};

// --- コード ---
// 表示するのはこの <script> 自身。日本語のコメントは文字の格子に乗らないので消す
const LINES = SRC.split('\n')
  .map(l => l.replace(/\s*\/\/.*[^\x00-\x7f].*$/, '').replace(/[^\x20-\x7e]/g, ''))
  .filter((l, i, a) => l.trim() || (a[i - 1] || '').trim());
// 配色。[地, 文字, 薄い文字, 色1..5]。1周ごとに次の配色に替える
const PALETTES = [
  ['#050505', '#e6e6e6', '#4a4a4a', '#c6ff00', '#ff2d6f', '#00e5ff', '#ff9e00', '#7a5cff'],
  ['#efeae0', '#1a1a1a', '#a59f94', '#ff4f00', '#0047ff', '#00a86b', '#e60073', '#222222'],
  ['#2a0008', '#ffd6dc', '#7a3a44', '#ffffff', '#ff3355', '#ffcc00', '#ff8fa3', '#9b0020'],
  ['#001a0e', '#7dff9a', '#1f6b38', '#d4ffde', '#00ff66', '#b0ffc4', '#3dd668', '#0b8f3a'],
];
let pal = 0, BG, STYLES;
// [文字色, 地の色]。識別子、( ) [ ]、コメント、キーワード、文字列、数値、演算子、+、{ }、選んだ1語
function setPalette(i) {
  const [bg, fg, dim, c1, c2, c3, c4, c5] = PALETTES[i % PALETTES.length];
  BG = bg;
  STYLES = [[fg], [c4], [dim], [bg, c1], [bg, c2], [bg, c3], [bg, dim], [bg, c5], [bg, c4], [bg, fg]];
}
setPalette(0);
const TOKEN = /(\/\/.*)|('[^']*'?|`[^`]*`?|"[^"]*"?)|(\b\d[\w.]*)|(\b(?:const|let|function|return|if|else|for|while|new|of|in|true|false)\b)|([A-Za-z_$][\w$]*)|(\+(?![+=]))|([=+\-*/<>!&|?:%^~]+)|([{}])|([()[\]])|([;,.])/g;
const GSTYLE = [2, 4, 5, 3, 0, 7, 6, 8, 1, 0];   // TOKEN の括弧の順
let picked = '';   // 地を敷く識別子。リセットのたびに選び直す
function reset() {
  if (!ch) return;
  ch.fill(0); st.fill(0); gone.fill(0); ch2.set(ch); st2.set(st);
  let n = Math.random() * LINES.length | 0;
  const words = LINES.slice(n, n + ROWS).join(' ').match(/\b[a-z]\w{2,}/gi) || [''];
  picked = words[Math.random() * words.length | 0];
  for (let y = 0; y < ROWS; y++, n++) {
    for (const m of LINES[n % LINES.length].matchAll(TOKEN)) {
      const g = m.slice(1).findIndex(v => v !== undefined), s = m[0] === picked ? 9 : GSTYLE[g];
      for (let i = 0; i < m[0].length; i++) {
        const x = 1 + m.index + i;
        if (x < COLS) { ch[y * COLS + x] = m[0].charCodeAt(i) - 32; st[y * COLS + x] = s; }
      }
    }
  }
}

// --- 溶かす操作 ---
// 変位場。u, v は 0..1 の位置、t は時間。マスごとに「どれだけ離れたマスから文字を持ってくるか」を返す（-1..1）
const WARPS = {
  swirl: (u, v) => [-(v - 0.5) * 2, (u - 0.5) * 2],
  wave: (u, v, t) => [Math.sin(v * 13 + t * 2), Math.sin(u * 9 + t * 1.3) * 0.6],
  drip: (u, v, t) => [Math.sin(v * 31 + t) * 0.3, 0.6 + 0.6 * Math.sin(u * 47 + t * 0.7)],
  zoom: (u, v) => [(u - 0.5) * 2, (v - 0.5) * 2],
  flow: (u, v, t) => [Math.sin(u * 7 + v * 5 + t), Math.cos(u * 4 - v * 8 + t * 0.7)],
  comb: (u, v, t) => [Math.sin(u * 170) * (0.5 + 0.5 * Math.sin(v * 6 + t)), Math.sin(v * 90 + t) * 0.3],
};
// 毎フレーム、元のコード（ch, st）から「変位ぶん離れたマス」の文字と色を読んで画面（ch2, st2）に写す。前のフレームには積み重ねない。
// 変位は四捨五入するので、変位が同じ場所ではコードが読めるまま動き、変位が変わる境目では同じ文字が繰り返されて筋になる
// 2つの変位場を足す。溶けている場所は中心 (mx, my) から半径 r の内側
function warp(f1, a1, f2, a2, t, mx, my, r) {
  for (let y = 0, i = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++, i++) {
    if (gone[i]) { ch2[i] = st2[i] = 0; continue; }
    const u = x / COLS, v = y / ROWS, k = Math.min(1, Math.max(0, (r - Math.hypot(u - mx, v - my)) * 3));
    const [dx1, dy1] = f1(u, v, t), [dx2, dy2] = f2(u, v, t * 1.3);
    const sx = Math.min(COLS - 1, Math.max(0, x - Math.round((dx1 * a1 + dx2 * a2) * k)));   // 端の外は端の文字を伸ばす
    const sy = Math.min(ROWS - 1, Math.max(0, y - Math.round((dy1 * a1 + dy2 * a2) * k)));
    ch2[i] = ch[sy * COLS + sx]; st2[i] = st[sy * COLS + sx];
  }
}

// --- 文字のアトラス ---
// スタイルごとに1行、印字できる ASCII 95文字を並べる。毎フレームはここから drawImage で写すだけ
const atlas = document.createElement('canvas');
let font = 'monospace';
function buildAtlas(font) {
  atlas.width = 95 * CW; atlas.height = STYLES.length * CH;
  const a = atlas.getContext('2d');
  a.clearRect(0, 0, atlas.width, atlas.height);
  a.font = `40px ${font}`; const size = 40 * CW / a.measureText('M').width;   // 横幅がちょうど CW になる大きさ
  a.font = `${size}px ${font}`; a.textBaseline = 'middle'; a.textAlign = 'center';
  STYLES.forEach(([fg, bg], s) => {
    if (bg) { a.fillStyle = bg; a.fillRect(0, s * CH, atlas.width, CH); }
    a.fillStyle = fg;
    for (let i = 0; i < 95; i++) for (const o of [0, 1]) a.fillText(String.fromCharCode(32 + i), i * CW + CW / 2 + o, s * CH + CH / 2 + 1);   // 1px ずらして2回描き、VGA のような太い字にする
  });
}

// --- 音 ---
// 132BPM のチップチューン。16小節で1周：14小節は矩形波のアルペジオとビート、2小節は抜き。
// 発振器の detune はすべて melt（ConstantSource）につないであり、2小節ごとに音程がずり落ちていく。映像の溶け方もこの進み具合に合わせる
const BPM = 132, ST = 60 / BPM / 4, events = [];
let step = 0;   // 録画のときは 0 に戻して、曲の頭から録る
let ac, an, out, audioDest, fft, noise, crush, space, melt;
let cycle = { t: 0, len: 1 };   // いま溶けている区間（音の時刻）
function startAudio() {
  if (ac) return ac.resume();
  ac = new AudioContext();
  out = ac.createGain(); out.gain.value = 0.8;
  const lim = ac.createDynamicsCompressor(); lim.threshold.value = -8; lim.ratio.value = 8;
  out.connect(lim);
  an = ac.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.6;
  fft = new Uint8Array(an.frequencyBinCount);
  lim.connect(an); lim.connect(ac.destination); lim.connect(audioDest = ac.createMediaStreamDestination());

  crush = ac.createWaveShaper();
  crush.curve = Float32Array.from({ length: 4096 }, (_, i) => Math.round((i / 2047.5 - 1) * 6) / 6);
  crush.connect(out);

  const ir = ac.createBuffer(2, ac.sampleRate * 1.2, ac.sampleRate);
  for (let k = 0; k < 2; k++) { const d = ir.getChannelData(k); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 4; }
  space = ac.createGain(); space.gain.value = 0.25;
  const rev = ac.createConvolver(); rev.buffer = ir; space.connect(rev).connect(out);

  melt = ac.createConstantSource(); melt.offset.value = 0; melt.start();

  const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  noise = () => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.loopStart = Math.random(); return s; };

  let next = ac.currentTime + 0.1;
  setInterval(() => { while (next < ac.currentTime + 0.2) { play(step++, next); next += ST; } }, 25);
}
function env(t, a, dcy, peak, node) { node.gain.setValueAtTime(0, t); node.gain.linearRampToValueAtTime(peak, t + a); node.gain.exponentialRampToValueAtTime(1e-4, t + a + dcy); }
const mtof = m => 440 * 2 ** ((m - 69) / 12);
function kickAt(t, v = 1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.08);
  env(t, 0.001, 0.25, 1.1 * v, g); o.connect(g).connect(out); o.start(t); o.stop(t + 0.3);
}
// スネア：ノイズをビットクラッシュに通す
function snareAt(t, len = 0.12, v = 1) {
  const n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 0.7;
  env(t, 0.001, len, 0.8 * v, g); n.connect(f).connect(g).connect(crush); g.connect(space); n.start(t); n.stop(t + len + 0.05);
}
function hatAt(t, v = 1) {
  const n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'highpass'; f.frequency.value = 7000;
  env(t, 0.0005, 0.02, 0.35 * v, g); n.connect(f).connect(g).connect(out); n.start(t); n.stop(t + 0.05);
}
// 矩形波の1音。detune を melt につなぐので、鳴っている途中でも音程が落ちていく
function sqAt(t, midi, len, v, type = 'square') {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = mtof(midi); melt.connect(o.detune);
  env(t, 0.002, len, v, g); o.connect(g).connect(out); g.connect(space); o.start(t); o.stop(t + len + 0.05);
}
// 8小節のコード：Am F C G Am F Dm E
const ROOTS = [57, 53, 48, 55, 57, 53, 50, 52], MINOR = [1, 0, 0, 0, 1, 0, 1, 0];
const ARP = [0, 1, 2, 3, 2, 1, 0, 1, 2, 3, 4, 3, 2, 1, 2, 3];
function play(step, t) {
  const bar = Math.floor(step / 16), s = step % 16, b8 = bar % 8, sparse = bar % 16 >= 14;
  const root = ROOTS[b8], tri = [0, MINOR[b8] ? 3 : 4, 7, 12, 15 + (MINOR[b8] ? 0 : 1)];
  if (s === 0 && bar % 2 === 0) {
    // 2小節ごとに音程を戻し、そこから落としていく。抜きの2小節はもっと深く落ちる
    const len = ST * 32, depth = sparse ? -2400 : -(250 + Math.random() * 450);
    melt.offset.cancelScheduledValues(t); melt.offset.setValueAtTime(0, t); melt.offset.linearRampToValueAtTime(depth, t + len * 0.97);
    events.push({ t, type: 'reset', sparse, len, hit: bar % 16 === 0 });
    if (b8 === 0) { kickAt(t, 1.3); snareAt(t, 0.5, 1); }
  }
  if (sparse) {   // 抜き：ゆっくりのアルペジオだけが落ちていく
    if (s % 4 === 0) sqAt(t, root + 12 + tri[(s / 4 + bar) % 4], ST * 3, 0.07);
    if (Math.random() < 0.25) { hatAt(t, 0.5); events.push({ t, type: 'click' }); }
    return;
  }
  sqAt(t, root + 12 + tri[ARP[s]], ST * 0.8, 0.06);
  if (s % 2 === 0) sqAt(t, root - 12 + (s % 8 === 6 ? 12 : 0), ST * 1.6, 0.1, 'triangle');
  if ([0, 6, 8].includes(s) || (s === 11 && Math.random() < 0.5)) { kickAt(t); events.push({ t, type: 'kick' }); }
  const fill = bar % 2 === 1 && s >= 12;   // 2小節目の終わりはスネアの連打
  if (fill) { snareAt(t, 0.05, 0.7); snareAt(t + ST / 2, 0.05, 0.8); events.push({ t, type: 'fill' }); }
  else if (s === 4 || s === 12) { snareAt(t); events.push({ t, type: 'snare' }); }
  hatAt(t, s % 2 ? 0.4 : 0.8);
}

// --- 映像 ---
// 16小節で1周：頭でコードを並べ直し、14小節かけて溶ける範囲と強さを広げ、抜きの2小節で文字を消していく
let lvl = 0, kick = 0, snare = 0, sparse = 0, flash = 0;
let fnName = 'swirl', fn2 = 'wave', mx = 0.5, my = 0.5, phaseT = 0;
const pick = () => Object.keys(WARPS)[Math.random() * 6 | 0];
function onEvent(e) {
  if (e.type === 'reset') {
    if (e.hit) { setPalette(pal++); buildAtlas(font); reset(); flash = 1; cycle = { t: e.t, len: e.len * 8 }; fnName = pick(); mx = 0.2 + Math.random() * 0.6; my = 0.2 + Math.random() * 0.6; }
    sparse = e.sparse ? 1 : 0; fn2 = pick();   // 2小節ごとに、もう1つの変位場を替える
  }
  if (e.type === 'kick') kick = 1;
  if (e.type === 'snare' || e.type === 'fill') snare = 1;
}
function frame() {
  requestAnimationFrame(frame);
  while (ac && events.length && events[0].t <= ac.currentTime) onEvent(events.shift());
  if (an) {
    an.getByteFrequencyData(fft);
    let s = 0; for (let i = 1; i < 120; i++) s += fft[i];
    lvl += (s / (119 * 255) - lvl) * 0.3;
  }
  flash *= 0.8; kick *= 0.85; snare *= 0.8;
  if (ac) {
    const p = Math.min(1, Math.max(0, (ac.currentTime - cycle.t) / cycle.len)), t = ac.currentTime;
    // 溶ける範囲は (mx, my) から広がり、区間の後ろほど・音が大きいほど大きくずれる
    const r = 0.15 + p * 1.5, a1 = 1 + p * 9 + lvl * 3 + kick * 2, a2 = p * 4 + snare * 3;
    // 抜き：文字を点々と消していく。地のある文字は少し長く残る
    if (sparse) for (let k = 0; k < COLS * ROWS * 0.02; k++) { const i = Math.random() * COLS * ROWS | 0; if (STYLES[st2[i]].length < 2 || Math.random() < 0.3) gone[i] = 1; }
    warp(WARPS[fnName], a1, WARPS[fn2], a2, t * 1.5, mx, my, r);
  }

  ctx.fillStyle = flash > 0.1 ? '#ffffff' : BG; ctx.fillRect(0, 0, W, H);
  if (flash > 0.1) return;
  for (let y = 0, i = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++, i++) {
    if (!ch2[i] && STYLES[st2[i]].length < 2) continue;   // 地のない空白は描かない
    ctx.drawImage(atlas, ch2[i] * CW, st2[i] * CH, CW, CH, x * CW, y * CH, CW, CH);
  }
}

document.fonts.load('20px VT323').catch(() => {}).then(() => {
  font = document.fonts.check('20px VT323') ? 'VT323' : 'monospace'; buildAtlas(font);
  document.getElementById('aspect').onchange = setSize; setSize();
  requestAnimationFrame(frame);
});

document.getElementById('play').onclick = startAudio;
c.onpointerdown = startAudio;

document.getElementById('rec').onclick = e => {
  startAudio(); step = 0;
  const btn = e.target, type = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const stream = c.captureStream(30);
  audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
  const chunks = [];
  rec.ondataavailable = ev => chunks.push(ev.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(window.lastBlob = new Blob(chunks, { type }));
    a.download = `meltdown_${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`; a.click();
    btn.disabled = false; btn.textContent = '● 録画して保存';
  };
  btn.disabled = true; btn.textContent = '録画中…';
  rec.start(); setTimeout(() => rec.stop(), document.getElementById('dur').value * 1000);
};
</script>
</body>
</html>
