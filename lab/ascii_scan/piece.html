<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII Scan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=block">
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  #panel { width: 240px; display: grid; gap: 8px; align-content: start; }
  canvas#c { max-width: min(100%, 720px); max-height: 90vh; background: #000; }
  button, select { font: inherit; padding: 6px; }
</style>
</head>
<body>
<div id="panel">
  <select id="aspect">
    <option value="1080x1920">9:16</option>
    <option value="1080x1080">1:1</option>
  </select>
  <button id="play">▶ 音を鳴らす</button>
  <label>録画秒数 <input type="number" id="dur" min="3" max="60" value="15"></label>
  <button id="rec">● 録画して保存</button>
</div>
<canvas id="c"></canvas>

<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
// 素材（3D の点群か顔の写真）はまず小さなキャンバス（1マス = 1文字）に描き、その明るさを文字に置き換える
const src = document.createElement('canvas'), sctx = src.getContext('2d', { willReadFrequently: true });
let W, H;
const setSize = () => { [W, H] = document.getElementById('aspect').value.split('x').map(Number); c.width = W; c.height = H; };
document.getElementById('aspect').onchange = setSize; setSize();

// --- 音（フィルターハウス 124BPM）---
// 鳴らす音は events にも積み、映像側がちょうどその時刻に拾う
const BPM = 124, ST = 60 / BPM / 4, events = [];
let ac, an, out, audioDest, fft, noise, space, pumpG, chordF, chordO, bassO, bassG, bassF;
const mtof = m => 440 * 2 ** ((m - 69) / 12);
// Am7 → Fmaj7 → C/G → G6 を2小節ずつ
const CHORDS = [[57, 60, 64, 67], [53, 57, 60, 64], [55, 60, 64, 67], [55, 59, 62, 64]];
function startAudio() {
  if (ac) return;
  ac = new AudioContext();
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  out = ac.createGain(); out.gain.value = 0.7; out.connect(comp);
  an = ac.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.6;
  fft = new Uint8Array(an.frequencyBinCount);
  comp.connect(an); comp.connect(ac.destination); comp.connect(audioDest = ac.createMediaStreamDestination());

  // 2秒のリバーブ
  space = ac.createGain();
  const rev = ac.createConvolver(), len = ac.sampleRate * 2, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3; }
  rev.buffer = ir; const rg = ac.createGain(); rg.gain.value = 0.35; space.connect(rev).connect(rg).connect(out);

  // コード：音ごとにデチューンした saw 2本 → ローパス（ゆっくり開け閉め）→ キックでポンプ
  chordF = ac.createBiquadFilter(); chordF.type = 'lowpass'; chordF.frequency.value = 600; chordF.Q.value = 6;
  pumpG = ac.createGain(); const cg = ac.createGain(); cg.gain.value = 0.07;
  chordF.connect(pumpG).connect(cg); cg.connect(out); cg.connect(space);
  chordO = CHORDS[0].flatMap(m => [-8, 8].map(dt => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = dt; o.connect(chordF); o.start(); return o; }));

  // ベース：裏拍で鳴る矩形波
  bassF = ac.createBiquadFilter(); bassF.type = 'lowpass'; bassF.frequency.value = 400;
  bassG = ac.createGain(); bassG.gain.value = 0; bassF.connect(bassG).connect(out);
  bassO = ac.createOscillator(); bassO.type = 'square'; bassO.connect(bassF); bassO.start();

  const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  noise = () => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; return s; };

  let next = ac.currentTime + 0.1, step = 0;
  setInterval(() => { while (next < ac.currentTime + 0.2) { play(step++, next); next += ST; } }, 25);
}
function env(t, a, dcy, peak, node) { node.gain.setValueAtTime(0, t); node.gain.linearRampToValueAtTime(peak, t + a); node.gain.exponentialRampToValueAtTime(1e-4, t + a + dcy); }
function kickAt(t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
  env(t, 0.001, 0.35, 1.2, g); o.connect(g).connect(out); o.start(t); o.stop(t + 0.4);
  pumpG.gain.setValueAtTime(0.1, t); pumpG.gain.setTargetAtTime(1, t + 0.03, 0.09);   // サイドチェイン
}
function clapAt(t, v = 1) {
  const n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = 1500; f.Q.value = 1;
  g.gain.setValueAtTime(0, t);
  for (let i = 0; i < 3; i++) { g.gain.setValueAtTime(0.8 * v, t + i * 0.01); g.gain.exponentialRampToValueAtTime(0.1, t + i * 0.01 + 0.009); }
  g.gain.exponentialRampToValueAtTime(1e-4, t + 0.2);
  n.connect(f).connect(g); g.connect(out); g.connect(space); n.start(t); n.stop(t + 0.22);
}
function hatAt(t, open) {
  const n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'highpass'; f.frequency.value = 8000;
  env(t, 0.001, open ? 0.16 : 0.025, open ? 0.25 : 0.12, g); n.connect(f).connect(g).connect(out); n.start(t); n.stop(t + 0.2);
}
// 8小節で1周。4・8小節目の最後の拍でクラップを連打、7小節目はキックを抜いてフィルターを開ける
function play(step, t) {
  const bar = Math.floor(step / 16), s = step % 16, b8 = bar % 8, drop = b8 === 6, fill = (b8 === 3 || b8 === 7) && s >= 12;
  if (s === 0) {
    const ch = CHORDS[Math.floor(b8 / 2)];
    chordO.forEach((o, i) => o.frequency.setValueAtTime(mtof(ch[i >> 1]), t));
    bassO.frequency.setValueAtTime(mtof(ch[0] - 24), t);
    if (drop) { chordF.frequency.setValueAtTime(250, t); chordF.frequency.exponentialRampToValueAtTime(5000, t + ST * 16); pumpG.gain.setTargetAtTime(1, t, 0.05); }
    else chordF.frequency.setTargetAtTime(700 + b8 * 350, t, 0.5);
    events.push({ t, type: 'bar', bar, drop });
  }
  if (!drop && s % 4 === 0) { kickAt(t); events.push({ t, type: 'kick' }); }
  if (fill) { clapAt(t, 0.5 + (s - 12) * 0.15); clapAt(t + ST / 2, 0.4 + (s - 12) * 0.15); events.push({ t, type: 'fill' }); }
  else if (s % 8 === 4) { clapAt(t); events.push({ t, type: 'clap' }); }
  if (s % 4 === 2) {
    hatAt(t, true); events.push({ t, type: 'ohat' });
    if (!drop) { bassG.gain.setValueAtTime(0.35, t); bassG.gain.setTargetAtTime(0, t + ST * 1.2, 0.03); bassF.frequency.setValueAtTime(1200, t); bassF.frequency.exponentialRampToValueAtTime(300, t + ST * 1.5); }
  } else hatAt(t, false);
}

// --- 映像 ---
const N = 9000, ps = Array.from({ length: N }, () => {
  const sy = Math.random() * 2 - 1, sa = Math.random() * 6.283, sr = Math.sqrt(1 - sy * sy);
  return { u: Math.random(), v: Math.random(), g: gauss(), sx: sr * Math.cos(sa), sy, sz: sr * Math.sin(sa), e: Math.random() * 12 | 0 };
});
function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
function terrain(x, z, t) {
  return Math.sin(x * 2.1 + t) * Math.cos(z * 1.7 - t * 0.8) + 0.5 * Math.sin((x + z) * 4.3 - t * 1.3) * Math.cos((x - z) * 3.1 + t);
}
// 立方体の12本の辺：[動く軸, 固定する2軸の符号]
const EDGES = [0, 1, 2].flatMap(ax => [[-1, -1], [-1, 1], [1, -1], [1, 1]].map(sg => [ax, sg]));
function shape(p, t, e) {
  switch (mode) {
    case 'sphere': { const r = 0.5 * (1 + terrain(p.sx * 3, p.sz * 3 + p.sy, t) * e); return [p.sx * r, p.sy * r, p.sz * r]; }
    case 'torus': {
      const a = p.u * 6.283, b = p.v * 6.283, r = 0.22 * (1 + terrain(a, b, t) * e), R = 0.6 + r * Math.cos(b);
      return [R * Math.cos(a), r * Math.sin(b), R * Math.sin(a)];
    }
    case 'cube': {
      const [ax, [s1, s2]] = EDGES[p.e], k = 0.42 * (1 + e * 0.6), q = [0, 0, 0], j = p.g * e * 0.12;
      q[ax] = (p.u * 2 - 1) * k; q[(ax + 1) % 3] = s1 * k + j; q[(ax + 2) % 3] = s2 * k - j;
      return q;
    }
    default: { const x = p.u * 2 - 1, z = p.v * 2 - 1; return [x * 1.1, terrain(x * 2, z * 2, t) * (0.08 + e * 0.6), z * 1.1]; }
  }
}
// 顔の写真（Google Flow で生成。file:// でも読めるよう末尾に base64 で埋め込んである）
const faces = [];
// 明るさ → 文字。暗い順に並べる
const RAMPS = [' .:-=+*#%@', ' .,:;ox%#@', ' .01', ' .-+x#', ' `^\\/|[]#'];
const MODES = ['face', 'face', 'face', 'sphere', 'torus', 'cube', 'terrain'];
let mode = 'face', face = 0, fx = 0, fy = 0, ramp = RAMPS[0], cols = 90, coarse = 0, yaw0 = 0, pitch = 0.4, roll = 0, zoom = 1;
let lvl = 0, kick = 0, flash = 0, invert = 0, spectrum = false, rowShift = [], rowNoise = [];
// スキャンライン：1小節かけて画面をなぞる（上→下、次の小節は下→上）。通ったあとに色が残る
const ACCENTS = ['#2ef', '#f2a', '#bf2', '#f82', '#a6f'];
let accent = ACCENTS[0], barT = 0, barDir = 1;
function onEvent(ev) {
  if (ev.type === 'bar') {   // 小節ごとにカット：素材・アングル・文字の粗さ・色を選び直す
    spectrum = ev.drop; barT = ev.t; barDir = ev.bar % 2 ? -1 : 1; accent = ACCENTS[Math.random() * ACCENTS.length | 0];
    mode = MODES[Math.random() * MODES.length | 0]; yaw0 = Math.random() * 6.283;
    pitch = (Math.random() * 1.4 - 0.4); roll = gauss() * 0.4; zoom = 0.9 + Math.random() * 0.7;
    face = Math.random() * faces.length | 0; fx = gauss() * 0.15; fy = gauss() * 0.1;
    cols = ev.drop ? 48 : [64, 90, 90, 120][Math.random() * 4 | 0];
  }
  if (ev.type === 'kick') { kick = 1; if (Math.random() < 0.25) coarse = 4; yaw0 += gauss() * 0.3; }
  if (ev.type === 'clap') { flash = 1; ramp = RAMPS[Math.random() * RAMPS.length | 0]; }
  if (ev.type === 'ohat') glitchRows(1 + Math.random() * 3 | 0);
  if (ev.type === 'fill') { invert = 3; glitchRows(8); ramp = RAMPS[Math.random() * RAMPS.length | 0]; }
}
function glitchRows(n) {   // 何行かを横にずらすか、文字化けさせる
  for (let i = 0; i < n; i++) {
    const r = Math.random() * rowShift.length | 0, h = 1 + Math.random() * 4 | 0;
    for (let k = r; k < Math.min(r + h, rowShift.length); k++) {
      if (Math.random() < 0.7) rowShift[k] = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 14 | 0); else rowNoise[k] = 1;
    }
  }
}
let adv = 0.6;
document.fonts.load('700 100px "Space Mono"').then(() => { ctx.font = '700 100px "Space Mono"'; adv = ctx.measureText('M').width / 100; });

function frame(time) {
  requestAnimationFrame(frame);
  while (ac && events.length && events[0].t <= ac.currentTime) onEvent(events.shift());
  let bass = 0, hi = 0;
  if (an) { an.getByteFrequencyData(fft); for (let i = 1; i < 8; i++) bass += fft[i]; bass /= 7 * 255; for (let i = 120; i < 300; i++) hi += fft[i]; hi /= 180 * 255; }
  lvl += (bass - lvl) * 0.2;

  // 文字の格子。キックのあと数フレームだけ粗くする
  const cw = W / (coarse-- > 0 ? cols / 2 : cols), px = cw / adv, rh = px * 1.0;
  const nc = Math.ceil(W / cw), nr = Math.ceil(H / rh);
  if (src.width !== nc || src.height !== nr) { src.width = nc; src.height = nr; rowShift = Array(nr).fill(0); rowNoise = Array(nr).fill(0); }

  sctx.globalCompositeOperation = 'source-over'; sctx.fillStyle = 'rgba(0,0,0,0.5)'; sctx.fillRect(0, 0, nc, nr);   // 短い残像
  const k = time / 1000;
  if (spectrum) {   // 抜きの小節：左右対称のスペクトラム
    sctx.globalCompositeOperation = 'lighter'; sctx.fillStyle = 'rgba(255,255,255,0.8)';
    const half = nc / 2 | 0;
    for (let x = 0; x < half; x++) {
      const v = an ? fft[2 + Math.floor((x / half) ** 2 * 200)] / 255 : 0, h = v * nr * 0.9;
      sctx.fillRect(half + x, (nr - h) / 2, 1, h); sctx.fillRect(half - 1 - x, (nr - h) / 2, 1, h);
    }
  } else if (mode === 'face' && faces[face]?.complete) {   // 顔：ゆっくり漂わせ、キックで寄る
    const s = Math.min(W, H) * 1.15 * zoom * (1 + kick * 0.08 + lvl * 0.05);
    const x0 = W / 2 - s / 2 + (fx + Math.sin(k * 0.7) * 0.03) * W, y0 = H / 2 - s / 2 + (fy + Math.cos(k * 0.5) * 0.02) * H;
    sctx.globalAlpha = 0.7; sctx.drawImage(faces[face], x0 / cw, y0 / rh, s / cw, s / rh); sctx.globalAlpha = 1;
  } else {
    const t = k * 2, e = 0.04 + lvl * lvl * 0.5 + kick * 0.15;
    const yaw = yaw0 + k * 0.4, cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), cr = Math.cos(roll), sr = Math.sin(roll);
    const R = Math.min(W, H) * 0.42 * zoom * (1 + kick * 0.12), D = R * 5;
    sctx.globalCompositeOperation = 'lighter'; sctx.fillStyle = '#fff';
    const dens = 0.1 * nc * nr / N;   // 1マスあたりの点の数で濃さをそろえる
    for (const p of ps) {
      const [X, Y, Z] = shape(p, t, e);
      const x1 = X * cy - Z * sy, z1 = X * sy + Z * cy, y2 = Y * cp - z1 * sp, z2 = Y * sp + z1 * cp;
      const x3 = x1 * cr - y2 * sr, y3 = x1 * sr + y2 * cr, s = R * D / (z2 * R + D);
      sctx.globalAlpha = Math.min(1, dens * (0.15 + 0.85 * Math.max(0, 0.6 - z2)));   // 手前ほど明るい
      sctx.fillRect((W / 2 + x3 * s) / cw, (H / 2 - y3 * s) / rh, 1, 1);
    }
    sctx.globalAlpha = 1;
  }

  // 明るさを文字に置き換えて、1行ずつ描く
  const img = sctx.getImageData(0, 0, nc, nr).data, gain = 1 + flash * 0.8 + kick * 0.4, n = ramp.length;
  const inv = invert > 0;
  ctx.fillStyle = inv ? '#fff' : '#000'; ctx.fillRect(0, 0, W, H);
  ctx.font = `700 ${px}px "Space Mono"`; ctx.textBaseline = 'top';
  const ph = ac ? Math.min(1, (ac.currentTime - barT) / (ST * 16)) : (time / 2000) % 1;
  const scanY = (barDir > 0 ? ph : 1 - ph) * nr, trail = nr * 0.25;
  for (let y = 0; y < nr; y++) {
    const d = (scanY - y) * barDir;   // スキャンラインが通り過ぎてからの距離（行）
    const onLine = d >= 0 && d < 1.5, tr = d >= 0 && d < trail ? 1 - d / trail : 0;
    if (onLine && Math.random() < 0.5) rowShift[y] = (Math.random() * 7 | 0) - 3;   // ライン上の行は少し横にぶれる
    // 暗い文字と明るい文字を別の行文字列に分け、色を変えて重ねる（等幅なので位置はずれない）
    let dim = '', bright = '';
    for (let x = 0; x < nc; x++) {
      let v;
      if (rowNoise[y] > 0 && Math.random() < 0.6) v = Math.random();
      else {
        v = Math.min(1, img[(y * nc + x) * 4] / 255 * (gain + tr * 0.8));
        if (Math.random() < hi * 0.04) v = Math.random();   // 高音で文字がちらつく
        if (onLine) v = Math.max(v, 0.3 + Math.random() * 0.4);   // ライン上は何もない所にも文字を出す
      }
      const ch = ramp[Math.min(n - 1, v * n | 0)];
      if (v > 0.55) { bright += ch; dim += ' '; } else { dim += ch; bright += ' '; }
    }
    const sh = ((rowShift[y] % nc) + nc) % nc, rot = s => sh ? s.slice(nc - sh) + s.slice(0, nc - sh) : s;
    // 暗い文字はグレー、明るい文字は白。スキャンラインが通ったあとは色が付き、だんだん戻る
    ctx.globalAlpha = 1;
    ctx.fillStyle = inv ? '#000' : tr ? accent : '#777'; ctx.fillText(rot(dim), 0, y * rh);
    ctx.fillStyle = inv ? '#000' : onLine ? '#fff' : accent; ctx.globalAlpha = onLine ? 1 : 0.35 + 0.65 * tr;
    ctx.fillText(rot(bright), 0, y * rh);
    if (!inv && !onLine) { ctx.fillStyle = '#fff'; ctx.globalAlpha = 1 - tr; ctx.fillText(rot(bright), 0, y * rh); }
    if (Math.random() < 0.3) rowShift[y] = Math.trunc(rowShift[y] * 0.6);
    rowNoise[y] = Math.max(0, rowNoise[y] - 0.2);
  }
  ctx.globalAlpha = 1; kick *= 0.85; flash *= 0.8; invert--;
}
requestAnimationFrame(frame);

document.getElementById('play').onclick = startAudio;
c.onpointerdown = startAudio;

document.getElementById('rec').onclick = e => {
  startAudio();
  const btn = e.target, type = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const stream = c.captureStream(30);
  audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 12e6 });
  const chunks = [];
  rec.ondataavailable = ev => chunks.push(ev.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(window.lastBlob = new Blob(chunks, { type }));
    a.download = `ascii_scan_${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`; a.click();
    btn.disabled = false; btn.textContent = '● 録画して保存';
  };
  btn.disabled = true; btn.textContent = '録画中…';
  rec.start(); setTimeout(() => rec.stop(), document.getElementById('dur').value * 1000);
