const c = document.getElementById('c'), ctx = c.getContext('2d');

const rot = ([x, y, z], rx, ry) => {

// 頭を (cx, cy) に sc 倍で描く。こちらを向いた三角形だけを描き、裏の線は消す。キックでうなずく

// 頭の向きは拍ごとに替える。横顔と斜めだけ（正面に近いと凹凸が見えない）。pitch でうつむき・見上げ
const LOOKS = [[PI / 2, 0], [0.9, 0.25], [1.2, -0.2], [-PI / 2, 0], [-0.9, 0.25], [-1.2, -0.15], [PI / 2, 0.3]];
let looks = 0;
function onEvent(e) {
  if (e.type === 'bar') flash = 1;
  if (e.type === 'beat') {
    const b = e.beat % 4, bar = e.beat / 4 | 0;
    if (b === 2) { scene = TEXT; word = WORDS[bar % WORDS.length]; }
    else if (b === 1 && bar % 4 === 3) { scene = 2; bodyPose = (bodyPose + 1 + (Math.random() * (POSES.length - 1) | 0)) % POSES.length; }   // 前と違うポーズ
    else { scene = b === 1 ? 1 : 0; look = LOOKS[looks++ % LOOKS.length]; }
    flash = Math.max(flash, 0.5);
  }
  if (e.type === 'kick') kick = 1;
  if (e.type === 'hat') hat = 1;
}
function frame() {
  requestAnimationFrame(frame);
  while (events.length && events[0].t <= ac.currentTime) onEvent(events.shift());
  kick *= 0.85; hat *= 0.7; flash *= 0.88;
  // 頭の向きは、行き先へカクッと素早く寄せる
  const [y0, p0] = hist[0];
  hist.unshift([y0 + (look[0] - y0) * 0.25, p0 + (look[1] - p0) * 0.25]); hist.length = 40;
  draw(ac.currentTime);
}

document.getElementById('aspect').onchange = setSize;
document.getElementById('play').onclick = startAudio;
c.onpointerdown = startAudio;
setSize();   // 音を鳴らすまでは止まった1コマだけ

document.getElementById('rec').onclick = e => {
  startAudio(); step = 0;
  const btn = e.target, type = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const stream = c.captureStream(30);
  audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
  const chunks = [];
  rec.ondataavailable = ev => chunks.push(ev.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(window.lastBlob = new Blob(chunks, { type }));
    a.download = `vector_${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`; a.click();
    btn.disabled = false; btn.textContent = '● 録画して保存';
  };
  btn.disabled = true; btn.textContent = '録画中…';
  rec.start(); setTimeout(() => rec.stop(), document.getElementById('dur').value * 1000);
};
</script>
