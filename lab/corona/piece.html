<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corona</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  #panel { width: 240px; display: grid; gap: 8px; align-content: start; }
  canvas { max-width: min(100%, 720px); max-height: 90vh; background: #000; }
  button, select { font: inherit; padding: 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps" style="position:fixed;right:8px;top:8px;color:#0f0;font:12px monospace"></div>
<div id="panel">
  <select id="aspect">
    <option value="1080x1920">9:16</option>
    <option value="1080x1350">4:5</option>
    <option value="1080x1080">1:1</option>
  </select>
  <button id="play">▶ 音を鳴らす</button>
  <label>録画秒数 <input type="number" id="dur" min="3" max="60" value="15"></label>
  <button id="rec">● 録画して保存</button>
</div>

<script>
// 黒い球（ボイド）の縁から白い粒子の筋が噴き出す。15秒を3.75秒×4の「呼吸」に分け、
// 頭のキックで吐く（粒子が外へ噴き出す）、後半のノイズの立ち上がりで吸う（外から球へ吸い込まれる）
const c = document.getElementById('c'), ctx = c.getContext('2d');
const LOOP = 15, CYC = LOOP / 2, BEAT = CYC / 16, N = 200000;   // 和音ひとつが CYC

// ---- 譜面：音も映像もここから読む ----
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const EV = [];   // 暗いアンビエント：15秒で2つの和音。頭で遠い低い響き、あとは火の粉がまばらに
const CHORDS = [[38, 45, 50, 53, 57], [34, 41, 46, 50, 53]];   // MIDI：D の短調（Dm add9）→ B♭（maj7 寄り）。低い所に寄せて暗く
for (let k = 0; k < 2; k++) {
  const T = k * LOOP / 2;
  EV.push({ t: T, type: 'big' }, { t: T, type: 'pad', c: k });
  EV.push({ t: T + 4.5, type: 'inhale' });
  // ビート（128 BPM、和音ひとつに16拍＝4小節）：4つ打ちのキック、小節の頭は強め、裏に小さなハット
  for (let b = 1; b < 16; b++) EV.push({ t: T + b * BEAT, type: 'small', v: b % 4 === 0 ? 0.85 : 0.55 });
  for (let b = 0; b < 16; b++) EV.push({ t: T + (b + 0.5) * BEAT, type: 'hat', v: b % 2 ? 1 : 0.6 });
  for (let b = 1; b < 16; b += 2) if (!(k === 1 && b >= 13)) EV.push({ t: T + b * BEAT, type: 'clap' });   // 2拍目と4拍目にクラップ
  if (k === 1) for (let x = 12 * BEAT, i = 0; x < CYC - 0.01; i++) { EV.push({ t: T + x, type: 'snare', v: i }); x += x < 14 * BEAT ? BEAT / 2 : x < 15 * BEAT ? BEAT / 4 : BEAT / 8; }   // 最後の小節はスネアのロールで頭へ戻る
  for (let s = 0; s < 6; s++) if (rnd() < 0.6) EV.push({ t: T + 0.8 + rnd() * 6, type: 'crackle', v: rnd() });
}
EV.sort((a, b) => a.t - b.t);
const last = (tl, type) => { let x = -99; for (const e of EV) { if (e.t > tl) break; if (e.type === type) x = e.t; } return x; };

// ---- 音 ----
let ac = null, t0 = 0, out, noiseBuf, nextEv = 0, loopN = 0;
let verb;
function audio() {
  if (ac) return;
  ac = new AudioContext();
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
  out = ac.createGain(); out.gain.value = 0.7; out.connect(comp); comp.connect(ac.destination);
  window.audioDest = ac.createMediaStreamDestination ? ac.createMediaStreamDestination() : null;
  if (audioDest) comp.connect(audioDest);
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // 残響：6秒で消えるノイズを畳み込む（ステレオ）
  const L = ac.sampleRate * 6, ir = ac.createBuffer(2, L, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const x = ir.getChannelData(ch); for (let i = 0; i < L; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / L, 3); }
  verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.9; verb.connect(vg); vg.connect(out);
  // 底でずっと鳴る低い唸り：ゆっくりふくらんで、しぼむ
  const drone = ac.createGain(); drone.gain.value = 0.1; drone.connect(out);
  const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 1 / 7.5; lg.gain.value = 0.05; lfo.connect(lg); lg.connect(drone.gain); lfo.start();
  [36.7, 36.95, 55.1].forEach(f => { const o = ac.createOscillator(); o.frequency.value = f; o.connect(drone); o.start(); });
  // 風：低い所だけ通したノイズ。こもり具合がゆっくり動く
  const wn = noise(ac.currentTime, 1e5), wf = ac.createBiquadFilter(), wg = ac.createGain();
  wf.type = 'lowpass'; wf.Q.value = 4; wf.frequency.value = 260; wg.gain.value = 0.22;
  const wl = ac.createOscillator(), wlg = ac.createGain(); wl.frequency.value = 1 / 15; wlg.gain.value = 160; wl.connect(wlg); wlg.connect(wf.frequency); wl.start();
  wn.connect(wf); wf.connect(wg); wg.connect(out); wg.connect(verb);
  t0 = ac.currentTime + 0.05;
  setInterval(schedule, 25); schedule();
}
function noise(t, len) { const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true; n.start(t, Math.random()); n.stop(t + len); return n; }
function boom(t) {   // 遠い低い響き：歪ませず、ゆっくり消える
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(32, t + 1.5);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.08); g.gain.exponentialRampToValueAtTime(0.001, t + 4);
  o.connect(g); g.connect(out); g.connect(verb); o.start(t); o.stop(t + 4.1);
}
function kick(t, v) {   // こもった柔らかいキック：歪ませず、低い所だけ。少し残響へ
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(), sv = ac.createGain();
  f.type = 'lowpass'; f.frequency.value = 280;
  o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.18);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9 * v, t + 0.012); g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  sv.gain.value = 0.25; o.connect(f); f.connect(g); g.connect(out); g.connect(sv); sv.connect(verb); o.start(t); o.stop(t + 0.75);
}
function hat(t, v) {   // 小さなハット：短く、少し残響へ
  const n = noise(t, 0.04), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(0.06 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
  n.connect(f); f.connect(g); g.connect(out); g.connect(verb);
}
function clap(t) {   // クラップ：ずらした短いノイズ3つ＋残り。大きな残響へ送って暗い空間に響かせる
  const f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'bandpass'; f.frequency.value = 1300; f.Q.value = 1.2;
  [0, 0.011, 0.023].forEach(d => { const n = noise(t + d, 0.012); n.connect(f); });
  const tail = noise(t + 0.03, 0.18), tg = ac.createGain(); tg.gain.setValueAtTime(0.5, t + 0.03); tg.gain.exponentialRampToValueAtTime(0.001, t + 0.2); tail.connect(tg); tg.connect(f);
  g.gain.value = 0.32; f.connect(g); g.connect(out); g.connect(verb);
}
function snare(t, i) {   // ロール：だんだん細かく・大きく
  const n = noise(t, 0.12), f = ac.createBiquadFilter(), g = ac.createGain(), pk = 0.08 + Math.min(i, 20) * 0.012;
  f.type = 'bandpass'; f.frequency.value = 1400 + i * 60; f.Q.value = 1;
  g.gain.setValueAtTime(pk, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  n.connect(f); f.connect(g); g.connect(out); g.connect(verb);
}
function pad(t, notes) {   // 暗いパッド：少しずらしたノコギリ2本ずつを、こもらせてゆっくり立ち上げ、次の和音と重ねて消す
  const len = LOOP / 2 + 3, f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'lowpass'; f.Q.value = 2; f.frequency.setValueAtTime(250, t); f.frequency.linearRampToValueAtTime(900, t + len * 0.45); f.frequency.linearRampToValueAtTime(300, t + len);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07, t + 3); g.gain.setValueAtTime(0.07, t + len - 3); g.gain.linearRampToValueAtTime(0.0001, t + len);
  for (const m of notes) for (const dt of [-6, 6]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 440 * 2 ** ((m - 69) / 12); o.detune.value = dt; o.connect(f); o.start(t); o.stop(t + len); }
  f.connect(g); g.connect(out); g.connect(verb);
}
function breathIn(t, len) { // 次の和音へ向けて、低いノイズがゆっくり息を吸うように上がる
  const n = noise(t, len), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.Q.value = 3; f.frequency.setValueAtTime(150, t); f.frequency.exponentialRampToValueAtTime(1200, t + len);
  g.gain.setValueAtTime(0.001, t); g.gain.exponentialRampToValueAtTime(0.12, t + len - 0.1); g.gain.linearRampToValueAtTime(0, t + len);
  n.connect(f); f.connect(g); g.connect(verb);
}
function crackle(t, v) {   // 火の粉：小さく、残響の中で鳴る
  const n = noise(t, 0.008), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'highpass'; f.frequency.value = 3000 + v * 6000; g.gain.value = 0.05 + v * 0.08;
  n.connect(f); f.connect(g); g.connect(verb);
}
function schedule() {
  const ahead = ac.currentTime + 0.15;
  for (;;) {
    const e = EV[nextEv], t = t0 + loopN * LOOP + e.t;
    if (t > ahead) break;
    if (t >= ac.currentTime - 0.01) {
      if (e.type === 'big') { boom(t); kick(t, 1); }
      else if (e.type === 'small') kick(t, e.v);
      else if (e.type === 'hat') hat(t, e.v);
      else if (e.type === 'clap') clap(t);
      else if (e.type === 'snare') snare(t, e.v);
      else if (e.type === 'pad') pad(t, CHORDS[e.c]);
      else if (e.type === 'inhale') breathIn(t, LOOP / 2 - 4.5);
      else crackle(t, e.v);
    }
    if (++nextEv === EV.length) { nextEv = 0; loopN++; }
  }
}

// ---- GPU（WebGL2）の粒子 ----
// 粒子の状態は浮動小数のテクスチャ（TEX×TEX 個）。A：位置 xyz と年齢、B：寿命と速さ。毎コマ、シェーダーで次の状態を書く
const TEX = 2048;   // 2048² ≈ 420万個
const BRIGHT = 0.4;   // 1粒の明るさ
const FX = true;   // 音に合わせる演出（反転・RGB のずれ・スライス・ズーム・寄り）。いまは見た目だけ合わせるので切っておく
const FB = { zoom: 0, warp: 0, decay: 0, inKeep: 1 };   // 試し：フィードバックを切る   // フィードバック：1コマの拡大・ゆがみ・外の残り方・球の中の残り方
const glc = document.createElement('canvas'), gl = glc.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
gl.getExtension('EXT_color_buffer_float');
const GLSL_COMMON = `#version 300 es
precision highp float; precision highp int;
#define TEX ${TEX}
uint pcg(uint v) { uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float h1(inout uint s) { s = pcg(s); return float(s) / 4294967295.; }
vec3 mod289(vec3 x) { return x - floor(x * (1. / 289.)) * 289.; }
vec4 mod289(vec4 x) { return x - floor(x * (1. / 289.)) * 289.; }
vec4 permute(vec4 x) { return mod289(((x * 34.) + 1.) * x); }
float snoise(vec3 v) {   // 3D simplex ノイズ（Ashima）
  const vec2 C = vec2(1. / 6., 1. / 3.); const vec4 D = vec4(0., .5, 1., 2.);
  vec3 i = floor(v + dot(v, C.yyy)), x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz), l = 1. - g, i1 = min(g.xyz, l.zxy), i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx, x2 = x0 - i2 + C.yyy, x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(i.z + vec4(0., i1.z, i2.z, 1.)) + i.y + vec4(0., i1.y, i2.y, 1.)) + i.x + vec4(0., i1.x, i2.x, 1.));
  vec3 ns = .142857142857 * D.wyz - D.xzx;
  vec4 j = p - 49. * floor(p * ns.z * ns.z), x_ = floor(j * ns.z), y_ = floor(j - 7. * x_);
  vec4 x = x_ * ns.x + ns.yyyy, y = y_ * ns.x + ns.yyyy, h = 1. - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy), b1 = vec4(x.zw, y.zw), s0 = floor(b0) * 2. + 1., s1 = floor(b1) * 2. + 1., sh = -step(h, vec4(0.));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy, a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x), p1 = vec3(a0.zw, h.y), p2 = vec3(a1.xy, h.z), p3 = vec3(a1.zw, h.w);
  vec4 nm = 1.79284291400159 - .85373472095314 * vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3));
  p0 *= nm.x; p1 *= nm.y; p2 *= nm.z; p3 *= nm.w;
  vec4 m = max(.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.); m = m * m;
  return 42. * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
}
// 地殻の割れ目（目には見えない粒子の出口）：ノイズが 0 になる線（リッジ）。セルの網目にならない、うねった曲線になる。
// 別のノイズで途切れさせて、つながった網目に見えないようにする。1 が割れ目の真ん中
float crack(vec3 d, float w) {
  vec3 p = d * 1.8 + .3 * vec3(snoise(d * 3.), snoise(d * 3. + 7.), snoise(d * 3. + 13.));
  return (1. - smoothstep(0., w * 1.5, abs(snoise(p)))) * smoothstep(-.3, .3, snoise(d * 2.7 + 5.));
}
`;
const UPDATE_FS = GLSL_COMMON + `
uniform sampler2D A, B; uniform float dt, nz, flow, radial, jetV, hotT, hotJump, burst, flSum; uniform uint seed; uniform int init;
uniform vec4 fl[4];   // 噴き上げ：xyz が場所（表面の向き）、w が強さ
layout(location = 0) out vec4 oA; layout(location = 1) out vec4 oB;
vec3 pot(vec3 p, float t) { return vec3(snoise(p + vec3(0, t, 0)), snoise(p + vec3(31.4, 0, -t)), snoise(p + vec3(-t, 17.7, 0))); }
vec3 curl(vec3 p, float t) {   // 3本のノイズをベクトルポテンシャルにした curl：渦を巻くが湧き出しのない流れ
  const float e = .04; vec3 dx = vec3(e, 0, 0), dy = vec3(0, e, 0), dz = vec3(0, 0, e);
  vec3 x0 = pot(p - dx, t), x1 = pot(p + dx, t), y0 = pot(p - dy, t), y1 = pot(p + dy, t), z0 = pot(p - dz, t), z1 = pot(p + dz, t);
  return vec3((y1.z - y0.z) - (z1.y - z0.y), (z1.x - z0.x) - (x1.z - x0.z), (x1.y - x0.y) - (y1.x - y0.x)) / (2. * e);
}
// 生まれる点は表面の決まった3000か所。熱いところ（ノイズ）ほど生まれやすい
uniform float crackW;
vec3 emit(inout uint s, out float h) {
  for (int k = 0; k < 24; k++) {
    uint se = uint(h1(s) * 20000.) * 9781u + 17u;
    float z = h1(se) * 2. - 1., a = h1(se) * 6.2831853, q = sqrt(1. - z * z);
    vec3 d = normalize(vec3(cos(a) * q, sin(a) * q, z) + (vec3(h1(s), h1(s), h1(s)) - .5) * .006);
    h = clamp(snoise(d * 2.2 + vec3(hotJump, hotT, 0.)) * 1.6 - .15, 0., 1.);   // 熱いところを絞って、粒子を塊に集める
    if (h1(s) < crack(d, crackW) * (.25 + .75 * h)) return d;   // ひびの上だけ。熱いところほど多い
  }
  h = 0.; return vec3(0, 0, 1);
}
void main() {
  // 膜を表面から出し続ける：各粒子は球の表面に決まった「ふるさと」（ID から決まる点）を持ち、寿命が来たら必ずそこへ戻る。
  // 寿命は粒子ごとにずらすので、毎コマ薄い殻が1枚ずつ生まれ、層になって外へ押し出される。
  // 噴き上げる場所（表面の2〜3割）だけ殻が速く押し出されて積み重なり、塊になる。ほかは表面に貼りついたまま
  ivec2 ip = ivec2(gl_FragCoord.xy); uint id = uint(ip.y * TEX + ip.x), s = pcg(id + 1u);
  float zz = 1. - 2. * (float(id) + .5) / float(TEX * TEX), lon = float(id) * 2.39996323, qq = sqrt(1. - zz * zz);
  vec3 home = vec3(qq * cos(lon), zz, qq * sin(lon));   // ふるさと（フィボナッチらせん）
  // 試し：規則正しい格子の点（同心の殻 8 枚）を、なめらかなノイズでそのまま押しずらす（curl ではないので、点が寄る所は白い塊、離れる所は黒い穴、折れる所は明るい筋になる）
  uint li = id % 524288u; float sh = float(id / 524288u), la = (float(li / 1024u) + .5) / 512. * 3.14159265, lo = (float(li % 1024u) + .5) / 1024. * 6.2831853;   // 殻 1 枚に 1024（経度）×512（緯度）の格子
  float cz = 1. - 2. * la / 3.14159265, sz = sqrt(1. - cz * cz); home = vec3(sz * cos(lo), cz, sz * sin(lo));
  // フレア：表面の数か所だけ、殻を大きく持ち上げて広げる（点が寄って白く飛ぶ塊になる）。ほかは表面に貼りついたまま
  vec3 fo = vec3(0, 0, nz * .5); float f0 = snoise(home * 1.3 + fo); const float e = .02;
  vec3 g = vec3(snoise((home + vec3(e, 0, 0)) * 1.3 + fo), snoise((home + vec3(0, e, 0)) * 1.3 + fo), snoise((home + vec3(0, 0, e)) * 1.3 + fo)) - f0;
  g = (g - home * dot(g, home)) / e;   // 表面に沿ったノイズの坂
  vec3 hm = normalize(home + g * .12);   // 点を坂の上へ寄せる：山に点が集まって濃い塊、谷は空いて黒くなる
  float m = smoothstep(-.25, .5, snoise(hm * 1.3 + fo));   // 噴き上げる場所を広く（縁のほぼ全周から出る）
  // 軌道：殻ごとに表面の格子から生まれ、毎コマ「外へ上る速さ＋ノイズの流れ」で前のコマの続きから進む。寿命（約4秒）で表面に戻る
  float ph = fract(sh / 8. + .6 * snoise(home * 1.7 + vec3(sh * 3.1, 0, 0)) + nz * 3.);   // 生まれる時刻は近くの点どうしでそろえ、場所ごとになめらかにずらす：膜が生まれて流れで折れ、網目やレースの筋になる   // 生まれる時刻は1粒ずつばらす：表面から絶えず出て、同じ場所の粒子は同じ流れに乗り、つながった1つの炎になる
  vec4 a = texelFetch(A, ip, 0), b = texelFetch(B, ip, 0); vec3 p = a.xyz;
  if (init == 1 || ph < a.w) {   // 生まれる：表面の格子の点を、細かいしわの分だけずらした所
    vec3 k = hm * 1.5;
    p = hm * 1.002 + (.03 + .06 * m) * vec3(snoise(k * 4. + vec3(0, 0, nz)), snoise(k * 4. + vec3(17, 0, nz)), snoise(k * 4. + vec3(31, 0, nz)));
    b.z = m; b.w = pow(clamp(.5 + .7 * snoise(hm * .8 + vec3(9, 0, nz * .3)), 0., 1.), 2.);   // 炎の大きさ：大きな炎は数か所だけ、ほかは小さい（大きさをそろえない）

  const glitch = !FX ? 0 : (sec >= 1 ? Math.exp(-sinceBig * 12) : 0) + 0.5 * Math.exp(-sinceSn * 30) + 0.45 * Math.exp(-sinceCl * 16);   // 横スライス（クラップでも）   // 横スライスのずれ
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(P_POST);
  bindTex(P_POST, 'acc', accT, 0);
  const U = { gain: FX ? 1.5 + 0.6 * ex : 1.5, ca, glitch, R, ex, haze: 0, hz: S * 0.07, ringR: R + sinceBig * S * 0.9, ringW: S * 0.012,
              ringA: 0, flash: 50 * Math.exp(-sinceBig * 12), S, tt: now, pulse };
  for (const k in U) gl.uniform1f(P_POST.u(k), U[k]);
  gl.uniform2f(P_POST.u('res'), W, H); gl.uniform1ui(P_POST.u('gseed'), frameN); gl.uniform1i(P_POST.u('inv'), inv ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const zm = !FX ? 1 : 1 + 0.06 * Math.exp(-sinceBig * 10) + 0.03 * Math.exp(-sinceSm * 15) + 0.03 * Math.exp(-sinceSn * 25);   // ズームのパンチ
  ctx.setTransform(zm, 0, 0, zm, cx * (1 - zm), cy * (1 - zm)); ctx.drawImage(oc, 0, 0); ctx.setTransform(1, 0, 0, 1, 0, 0);

  requestAnimationFrame(frame);
}

document.getElementById('aspect').onchange = setSize; setSize();
requestAnimationFrame(frame);
document.getElementById('play').onclick = audio;
c.onpointerdown = audio;

document.getElementById('rec').onclick = e => {
  audio();
  const btn = e.target, type = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const stream = c.captureStream(30);
  audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
  const chunks = [];
  rec.ondataavailable = ev => chunks.push(ev.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = `corona_${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`; a.click();
    btn.disabled = false; btn.textContent = '● 録画して保存';
  };
  btn.disabled = true; btn.textContent = '録画中…';
  rec.start(); setTimeout(() => rec.stop(), document.getElementById('dur').value * 1000);
};
