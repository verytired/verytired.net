<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drag</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  #panel { width: 240px; display: grid; gap: 8px; align-content: start; }
  canvas { max-width: min(100%, 720px); max-height: 90vh; background: #000; }
  button, select { font: inherit; padding: 6px; }
  video { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <select id="aspect">
    <option value="1080x1920">9:16</option>
    <option value="1080x1350">4:5</option>
    <option value="1080x1080">1:1</option>
  </select>
  <button id="play">▶ 音を鳴らす</button>
  <label>録画秒数 <input type="number" id="dur" min="3" max="60" value="16"></label>
  <button id="rec">● 録画して保存</button>
</div>
<video src="src/drag_src.mp4" muted playsinline preload="auto"></video>

<script>
// 握って開く手（Veo の8秒を16秒に補間、src/prep.py で深度も並べた）。キックごとに手の上へ曲線が1本描かれ、線の上を進む点が近くの肉を進む向きへ押し流す（Photoshop の「ゆがみ」と同じ、ずれの場を毎ステップ運ぶ）。
// 押し流した分は残るので、線が増えるほど手は伸びた肉の筋になる。最後の小節で、ずれた肉を深度で盛り上げた板として横へ回し、真横（線）になって消える。
// 音は線ごとの低い声：引っぱる点の高さがそのまま音程になって滑る。下に低い持続音と、90 BPM の歪ませないキック
const BPM = 90, BEAT = 60 / BPM, BAR = 4 * BEAT, LOOP = 6 * BAR;   // LOOP = 16秒
const RATE = 30;   // ずれの場は1秒に30回運ぶ（書き出しで毎回同じになるよう時刻から数える）
const vid = document.querySelector('video');
const lerp = (a, b, x) => a + (b - a) * Math.min(1, Math.max(0, x));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// ---- 譜面と線 ----
const EV = [];
for (let bar = 0; bar < 6; bar++) {
  const at = b => bar * BAR + b * BEAT;
  if (bar === 0) { EV.push({ t: at(0), v: 1 }); continue; }
  for (const b of bar % 2 ? [0, 2.5] : [0, 1.75, 2.5]) EV.push({ t: at(b), v: b ? 0.8 : 1 });
}
// 線：1小節目からのキックごとに1本（最後の小節は回すので引かない）。手の真ん中あたりから、少し曲がったベジェで 0.3〜0.45 の長さ
const DUR = 0.9;   // 1本を引ききる秒数
const CURVES = EV.filter(e => e.t >= BAR && e.t < 5 * BAR).map((e, i) => {
  const s = i * 7 + 3, a = hash(s) * 6.283, L = 0.3 + 0.15 * hash(s + 1);
  const p0 = [0.5 + (hash(s + 2) - 0.5) * 0.35, 0.5 + (hash(s + 3) - 0.5) * 0.45];
  const p3 = [p0[0] + Math.cos(a) * L, p0[1] + Math.sin(a) * L];
  const bend = (hash(s + 4) - 0.5) * 0.5;
  const n = [-Math.sin(a) * L * bend, Math.cos(a) * L * bend];
  const p1 = [lerp(p0[0], p3[0], 0.33) + n[0], lerp(p0[1], p3[1], 0.33) + n[1]];
  const p2 = [lerp(p0[0], p3[0], 0.66) + n[0] * 1.6, lerp(p0[1], p3[1], 0.66) + n[1] * 1.6];
  return { t: e.t, p: [p0, p1, p2, p3], r: 0.05 + 0.03 * hash(s + 5) };
});
function bez(c, u) {   // 曲線の u（0〜1）の位置。縦横の比は 9:16 の画面を基準にした 0〜1
  const m = 1 - u, [a, b, d, e] = c.p;
  return [0, 1].map(i => m * m * m * a[i] + 3 * m * m * u * b[i] + 3 * m * u * u * d[i] + u * u * u * e[i]);
}
const ease = u => u * u * (3 - 2 * u);
const brushAt = (c, tl) => { const u = (tl - c.t) / DUR; return u < 0 || u > 1 ? null : bez(c, ease(u)); };

// ---- 音 ----
let ac = null, t0 = 0, out, nextEv = 0, loopN = 0;
function audio() {
  if (ac) return;
  vid.play();
  ac = new AudioContext();
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
  out = ac.createGain(); out.gain.value = 0.6; out.connect(comp); comp.connect(ac.destination);
  window.audioDest = ac.createMediaStreamDestination ? ac.createMediaStreamDestination() : null;
  if (audioDest) comp.connect(audioDest);
  // 底：C1 と少しずれた C1、5度のサイン
  const dg = ac.createGain(); dg.gain.value = 0.11; dg.connect(out);
  [32.7, 32.9, 49.0].forEach(f => { const o = ac.createOscillator(); o.frequency.value = f; o.connect(dg); o.start(); });
  t0 = ac.currentTime + 0.05;
  setInterval(schedule, 25); schedule();
}
const SEQ = [...EV.map(e => ({ ...e, type: 'kick' })), ...CURVES.map(c => ({ t: c.t, type: 'voice', c }))].sort((a, b) => a.t - b.t);
function schedule() {
  for (;;) {
    if (nextEv >= SEQ.length) { nextEv = 0; loopN++; }
    const e = SEQ[nextEv], t = t0 + loopN * LOOP + e.t;
    if (t > ac.currentTime + 0.2) break;
    nextEv++;
    if (t < ac.currentTime - 0.05) continue;
    e.type === 'kick' ? kick(t, e.v) : voice(t, e.c);
  }
}
function kick(t, v) {   // 低く長いキック（歪ませない）
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(105, t); o.frequency.exponentialRampToValueAtTime(34, t + 0.2);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + 1.02);
}
function voice(t, c) {   // 線1本の声：引っぱる点が上にあるほど高い（65〜196 Hz）。こもらせて、引ききったら余韻
  const o1 = ac.createOscillator(), o2 = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
  o1.type = 'sawtooth'; o2.type = 'sawtooth'; o2.detune.value = 9;
  lp.type = 'lowpass'; lp.Q.value = 5;
  for (let i = 0; i <= 30; i++) {
    const u = i / 30, y = bez(c, ease(u))[1], f = 65.4 * Math.pow(3, 1 - Math.min(1, Math.max(0, y)));
    const tt = t + u * DUR;
    o1.frequency.setValueAtTime(f, tt); o2.frequency.setValueAtTime(f, tt);
    lp.frequency.setValueAtTime(f * 3 + 200 * Math.sin(u * Math.PI), tt);
  }
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.22, t + 0.08);
  g.gain.setValueAtTime(0.22, t + DUR); g.gain.exponentialRampToValueAtTime(0.001, t + DUR + 1.4);
  o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(out);
  o1.start(t); o2.start(t); o1.stop(t + DUR + 1.5); o2.stop(t + DUR + 1.5);
}

// ---- 映像 ----
const c = document.getElementById('c');
const gl = c.getContext('webgl2', { antialias: true, preserveDrawingBuffer: true });
gl.getExtension('EXT_color_buffer_float');
const QUAD_VS = `#version 300 es
void main() { vec2 p = vec2((gl_VertexID & 1) * 4 - 1, (gl_VertexID & 2) * 2 - 1); gl_Position = vec4(p, 0, 1); }`;
// ずれの場：各画素に「素材のどこを見せるか」（素材の uv）を持つ。初めは画面にそのまま合わせた uv
const INIT_FS = `#version 300 es
precision highp float;
uniform vec2 res, vres;
out vec4 o;
void main() {
  vec2 p = gl_FragCoord.xy / res;
  float sc = max(res.x / vres.x, res.y / vres.y) * .95;
  vec2 q = (p * res - res * .5) / (vres * sc) + .5;
  q.y = 1. - q.y;   // 動画は上が 0、GL は下が 0
  o = vec4(q, 0, 1);
}`;
// 1ステップ：引っぱる点の近く（ガウス）を、点の進んだ向きへ運ぶ（場の値を、少し手前から持ってくる）
const STEP_FS = `#version 300 es
precision highp float;
uniform sampler2D prev; uniform vec2 res; uniform vec4 br[4]; uniform float rad[4];
out vec4 o;
void main() {
  vec2 a = vec2(res.x / res.y, 1.), p = gl_FragCoord.xy / res * a, d = vec2(0);
  for (int i = 0; i < 4; i++) { vec2 e = p - br[i].xy; d += br[i].zw * exp(-dot(e, e) / (rad[i] * rad[i])); }
  o = texture(prev, (p - d) / a);
}`;
// 描く：画面を細かい格子の板にし、各頂点はずれの場から素材の uv を取り、最後は深度で手前へ盛り上げて横へ回す
const GX = 180, GY = 320;
const MESH_VS = `#version 300 es
uniform sampler2D warp, vid; uniform vec2 res; uniform float rot, lift;
out vec2 vq; out vec3 wp;
float D(vec2 q) { return texture(vid, vec2(q.x, .5 + clamp(q.y, 0., 1.) * .5)).r; }
void main() {
  int cell = gl_VertexID / 6, k = gl_VertexID % 6;
  ivec2 off = ivec2[6](ivec2(0,0), ivec2(1,0), ivec2(0,1), ivec2(1,0), ivec2(1,1), ivec2(0,1))[k];
  vec2 p = (vec2(cell % ${GX}, cell / ${GX}) + vec2(off)) / vec2(${GX}, ${GY});
  vec2 q = texture(warp, p).xy;
  float asp = res.x / res.y;
  vec3 v = vec3((p.x - .5) * 2. * asp, (p.y - .5) * 2., smoothstep(.22, .9, D(q)) * lift);   // 背景（深度の低い所）は平らに。明るさで切ると暗い掌との境が壁になった
  float cs = cos(rot), sn = sin(rot);
  vec3 r = vec3(v.x * cs + v.z * sn, v.y, -v.x * sn + v.z * cs);
  float w = 1. - r.z * .25 * step(.001, lift + abs(rot));
  vq = q; wp = r;
  gl_Position = vec4(r.x / asp, r.y, -r.z * .1, w);
}`;
const MESH_FS = `#version 300 es
precision highp float;
uniform sampler2D vid; uniform float lift, fade, rot0;
in vec2 vq; in vec3 wp;
out vec4 o;
void main() {
  vec2 q = vq;
  float inside = step(0., q.x) * step(q.x, 1.) * step(0., q.y) * step(q.y, 1.);
  float x = texture(vid, vec2(q.x, clamp(q.y, 0., 1.) * .5)).r * inside;
  // 立体の陰：面の向き（板が回り始めてから）
  vec3 n = normalize(cross(dFdx(wp), dFdy(wp)));
  if (lift > 0. && abs(dot(n, normalize(vec3(sin(rot0), 0, cos(rot0))))) < .2) discard;   // 手のふちの切り立った壁は描かない（横から見るとヒレになる）
  float sh = mix(1., .35 + .9 * max(0., dot(n, normalize(vec3(.6, .5, .7)))), clamp(lift * 2., 0., 1.));
  o = vec4(vec3(x * sh * fade), 1);
}`;
// 線：引いた所までの点線と、引っぱる点の輪
const PT_VS = `#version 300 es
in vec3 a; uniform vec2 res;
out float al;
void main() { float asp = res.x / res.y; gl_Position = vec4((a.x / asp - .5) * 2., (a.y - .5) * 2., 0, 1); gl_PointSize = a.z > 1.5 ? 34. * res.x / 1080. : 7. * res.x / 1080.; al = fract(a.z); }`;
const PT_FS = `#version 300 es
precision highp float;
in float al; out vec4 o;
void main() { vec2 d = gl_PointCoord - .5; float r = length(d) * 2.; float ring = smoothstep(.75, .85, r) * (1. - smoothstep(.9, 1., r)); float dot_ = 1. - smoothstep(.7, 1., r); o = vec4(vec3(1), al * (al > .99 ? ring : dot_)); }`;
function prog(vs, fs) {
  const p = gl.createProgram();
  for (const [t, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(t); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    gl.attachShader(p, sh);
  }
  gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const loc = {}; p.u = n => n in loc ? loc[n] : (loc[n] = gl.getUniformLocation(p, n));
  return p;
}
const PI = prog(QUAD_VS, INIT_FS), PS = prog(QUAD_VS, STEP_FS), PM = prog(MESH_VS, MESH_FS), PP = prog(PT_VS, PT_FS);
function tex(w, h, f) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (w) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  return t;
}
function fbo(t) { const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return f; }
const vidT = tex(), ptBuf = gl.createBuffer(), ptVao = gl.createVertexArray();
gl.bindVertexArray(ptVao); gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0); gl.bindVertexArray(null);
gl.bindAttribLocation(PP, 0, 'a');
let W, H, FW, FH, buf = [], done = 0, prevTl = 0, cur = null;
const VW = 540, VH = 960;   // 素材の1段（上：映像、下：深度）
function setSize() {
  [W, H] = document.getElementById('aspect').value.split('x').map(Number);
  c.width = W; c.height = H; FW = W >> 1; FH = H >> 1;   // ずれの場は半分の解像度
  buf = [0, 1].map(() => { const t = tex(FW, FH); return { t, f: fbo(t) }; });
  reset();
}
function reset() {
  for (const b of buf) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, b.f); gl.viewport(0, 0, FW, FH); gl.useProgram(PI);
    gl.uniform2f(PI.u('res'), FW, FH); gl.uniform2f(PI.u('vres'), VW, VH);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  done = 0; cur = buf[0];
}
// 線の座標（9:16 の 0〜1）を画面の座標（縦 0〜1、横は縦横比ぶん）へ：横は真ん中に揃え、縦は上下を反転（GL は下が 0）
const toScr = ([x, y]) => [W / H / 2 + (x - 0.5) * (9 / 16), 1 - y];
function step(k) {
  const tl = k / RATE, tn = (k + 1) / RATE, br = new Float32Array(16), rad = new Float32Array(4).fill(1);
  let n = 0;
  for (const cv of CURVES) {
    const a = brushAt(cv, tl), b = brushAt(cv, tn);
    if (!a || !b || n >= 4) continue;
    const pa = toScr(a), pb = toScr(b);
    br.set([pb[0], pb[1], pb[0] - pa[0], pb[1] - pa[1]], n * 4); rad[n] = cv.r; n++;
  }
  const src = buf[k % 2], dst = buf[(k + 1) % 2];
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f); gl.viewport(0, 0, FW, FH); gl.useProgram(PS);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.t); gl.uniform1i(PS.u('prev'), 0);
  gl.uniform2f(PS.u('res'), FW, FH); gl.uniform4fv(PS.u('br'), br); gl.uniform1fv(PS.u('rad'), rad);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return dst;
}
function frame() {
  requestAnimationFrame(frame);
  const tl = ac ? Math.max(0, ac.currentTime - t0) % LOOP : (performance.now() / 1000) % LOOP;
  if (tl < prevTl) reset();   // ループの頭：手を元に戻す
  prevTl = tl;
  if (Math.abs(vid.currentTime - tl) > 0.15) vid.currentTime = Math.min(tl, (vid.duration || 16) - 0.05);
  if (vid.readyState >= 2) { gl.bindTexture(gl.TEXTURE_2D, vidT); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, vid); }
  const target = Math.floor(tl * RATE);
  if (target - done > 4) done = target - 4;
  while (done < target) { cur = step(done); done++; }
  const B = tl / BAR, end = Math.max(0, B - 5);   // 最後の小節 0→1
  const rot = ease(Math.min(1, end * 1.3)) * 1.15, lift = Math.min(1, end * 3) * 0.45;   // 真横までは回さない（縞の壁になって手が読めない）
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.useProgram(PM);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, cur.t); gl.uniform1i(PM.u('warp'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, vidT); gl.uniform1i(PM.u('vid'), 1);
  gl.uniform2f(PM.u('res'), W, H); gl.uniform1f(PM.u('rot'), rot); gl.uniform1f(PM.u('rot0'), rot); gl.uniform1f(PM.u('lift'), lift);
  gl.uniform1f(PM.u('fade'), 1 - Math.max(0, end - 0.8) / 0.2);
  gl.drawArrays(gl.TRIANGLES, 0, GX * GY * 6);
  gl.disable(gl.DEPTH_TEST);
  // 線：引いている線と、引き終えて 1.5 秒までの線（だんだん薄く）。板が回り始めたら消す
  const pts = [];
  if (end === 0) for (const cv of CURVES) {
    const u = (tl - cv.t) / DUR; if (u < 0 || u > 1 + 1.5 / DUR) continue;
    const al = u <= 1 ? 0.95 : 0.95 * (1 - (u - 1) * DUR / 1.5), uu = ease(Math.min(1, u));
    for (let i = 0; i <= 140; i++) { if (i / 140 > uu) break; const p = toScr(bez(cv, i / 140)); pts.push(p[0], p[1], al); }
    if (u <= 1) { const p = toScr(bez(cv, uu)); pts.push(p[0], p[1], 2.999); }
  }
  if (pts.length) {
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(PP); gl.uniform2f(PP.u('res'), W, H);
    gl.bindVertexArray(ptVao); gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pts), gl.DYNAMIC_DRAW);
    gl.drawArrays(gl.POINTS, 0, pts.length / 3); gl.bindVertexArray(null); gl.disable(gl.BLEND);
  }
}

document.getElementById('aspect').onchange = setSize; setSize();
requestAnimationFrame(frame);
document.getElementById('play').onclick = audio;
c.onpointerdown = audio;

document.getElementById('rec').onclick = e => {
  audio();
  const btn = e.target, type = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const stream = c.captureStream(30);
  audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
  const chunks = [];
  rec.ondataavailable = ev => chunks.push(ev.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = `drag_${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`; a.click();
    btn.disabled = false; btn.textContent = '● 録画して保存';
  };
  btn.disabled = true; btn.textContent = '録画中…';
  rec.start(); setTimeout(() => rec.stop(), document.getElementById('dur').value * 1000);
};
window.piece = { media: () => [vid], output: () => out };
</script>
</body>
</html>
