<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screensaver</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  #panel { width: 240px; display: grid; gap: 8px; align-content: start; }
  canvas { max-width: min(100%, 720px); max-height: 90vh; background: #000; }
  button, select { font: inherit; padding: 6px; }
</style>
</head>
<body>
<div id="panel">
  <select id="aspect">
    <option value="1080x1920">9:16</option>
    <option value="1080x1350">4:5</option>
    <option value="1080x1080">1:1</option>
  </select>
  <label>にじみ <input type="range" id="blur" min="0" max="1" step="0.05" value="0.6"></label>
  <label>光 <input type="range" id="glow" min="0" max="1" step="0.05" value="0.5"></label>
  <button id="play">▶ 音を鳴らす</button>
  <label>録画秒数 <input type="number" id="dur" min="3" max="60" value="48"></label>
  <button id="rec">● 録画して保存</button>
</div>
<canvas id="c"></canvas>

<script>
// 90年代の CG のような5本の動画を1小節ごとにディゾルブで切り替え、低解像度でにじませ、光らせ、粒を足す。
// 全体に VHS をかけ、場面の替わり目と8小節目はテープが飛ぶように崩す。曲はオルゴールとパッドの 75BPM。オルゴールの音で光り、キックで少し寄る
const SCENES = ['door', 'tv', 'jelly', 'chrome', 'moon'];
const c = document.getElementById('c'), ctx = c.getContext('2d');
const lo = document.createElement('canvas'), lctx = lo.getContext('2d', { willReadFrequently: true });   // にじませるための小さな写し
const vh = document.createElement('canvas'), vctx = vh.getContext('2d');     // lo を VHS で崩したもの（lo は崩さずに残す。コマ止めで同じコマを何度も崩すため）
const glow = document.createElement('canvas'), gctx = glow.getContext('2d'); // 光：縮小してぼかした写し
const vids = SCENES.map(n => Object.assign(document.createElement('video'), { src: `src/${n}_v1.mp4`, muted: true, loop: true, playsInline: true }));
let W, H;
const setSize = () => {
  [W, H] = document.getElementById('aspect').value.split('x').map(Number);
  c.width = W; c.height = H; glow.width = W / 4; glow.height = H / 4;
};

// 粒：ノイズの模様を4枚作っておき、毎コマ替えてずらして重ねる
const grains = [0, 1, 2, 3].map(() => {
  const g = document.createElement('canvas'); g.width = g.height = 256;
  const x = g.getContext('2d'), im = x.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  x.putImageData(im, 0, 0); return ctx.createPattern(g, 'repeat');
});

// --- 音 ---
// 75BPM。パッド（三角波とノコギリ波を少しずらす）、8分のオルゴール、柔らかいキック、小節の頭の鐘。全部を長い残響に送る
const BPM = 75, ST = 60 / BPM / 4, events = [];
let step = 0;   // 録画のときは 0 に戻して、曲の頭から録る
let ac, out, verb, echo, audioDest, noiseBuf;
const mtof = m => 440 * 2 ** ((m - 69) / 12);
function startAudio() {
  if (ac) return ac.resume();
  ac = new AudioContext();
  vids.forEach(v => v.play());   // 素材の動画も音と一緒に始める
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
  out = ac.createGain(); out.gain.value = 0.8; out.connect(comp);
  comp.connect(ac.destination); comp.connect(audioDest = ac.createMediaStreamDestination());

  // 残響：3.5秒で消えるノイズを響きの形にする
  verb = ac.createConvolver();
  const len = ac.sampleRate * 3.5, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2.5; }
  verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = 0.5; verb.connect(vg).connect(out);

  echo = ac.createDelay(2); echo.delayTime.value = ST * 3;
  const fb = ac.createGain(); fb.gain.value = 0.35;
  echo.connect(fb).connect(echo); fb.connect(verb);

  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const hiss = ac.createBufferSource(), hf = ac.createBiquadFilter(), hg = ac.createGain();   // テープのヒス
  hiss.buffer = noiseBuf; hiss.loop = true; hf.type = 'highpass'; hf.frequency.value = 4000; hg.gain.value = 0.012;
  hiss.connect(hf).connect(hg).connect(out); hiss.start();

  let next = ac.currentTime + 0.1;
  setInterval(() => { while (next < ac.currentTime + 0.2) { play(step++, next); next += ST; } }, 25);
}
function env(g, t, a, hold, rel, v) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.setValueAtTime(v, t + a + hold); g.gain.linearRampToValueAtTime(0, t + a + hold + rel); }
function padAt(t, midi, len) {
  const f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'lowpass'; f.frequency.value = 900;
  env(g, t, 1.2, len - 1.2, 2, 0.03);
  f.connect(g); g.connect(out); g.connect(verb);
  for (const [type, d] of [['triangle', -7], ['sawtooth', 6]]) {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = mtof(midi); o.detune.value = d;
    o.connect(f); o.start(t); o.stop(t + len + 2.2);
  }
}
// オルゴール：サイン波に、少し外れた高い倍音（4.2倍）を短く足す
function boxAt(t, midi, v) {
  const g = ac.createGain(); env(g, t, 0.003, 0.02, 1.6, 0.08 * v);
  g.connect(out); g.connect(verb); g.connect(echo);
  for (const [r, a] of [[1, 1], [4.2, 0.25]]) {
    const o = ac.createOscillator(), og = ac.createGain(); o.frequency.value = mtof(midi) * r;
    og.gain.setValueAtTime(a, t); og.gain.exponentialRampToValueAtTime(1e-4, t + (r > 1 ? 0.3 : 1.7));
    o.connect(og).connect(g); o.start(t); o.stop(t + 1.8);
  }
}
function chimeAt(t, midi) { boxAt(t, midi, 1.6); boxAt(t + 0.01, midi + 7, 0.8); }
function bassAt(t, midi, len) {
  const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = mtof(midi);
  env(g, t, 0.05, len, 0.6, 0.22); o.connect(g).connect(out); o.start(t); o.stop(t + len + 0.7);
}
function kickAt(t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
  g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(1e-4, t + 0.5);
  o.connect(g).connect(out); o.start(t); o.stop(t + 0.55);
}
// 4小節のコード：Fmaj7 Em7 Dm9 Cmaj7（下から）
const CHORDS = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60, 64], [48, 55, 59, 64]];
const ARP = [0, 2, 1, 3, 2, 1, 3, 2];   // 8分ごとに鳴らすコードの音（2オクターブ上）
function play(step, t) {
  const bar = Math.floor(step / 16), s = step % 16, ch = CHORDS[bar % 4];
  if (s === 0) {
    for (const m of ch) padAt(t, m, ST * 16);
    bassAt(t, ch[0] - 12, ST * 14);
    chimeAt(t, ch[1] + 24);
    events.push({ t, type: 'bar', bar });
  }
  if (bar >= 1 && s % 2 === 0 && Math.random() < (bar >= 4 ? 0.9 : 0.6)) {   // 1小節目は鐘とパッドだけ
    boxAt(t, ch[ARP[s / 2] % ch.length] + 24, 0.6 + Math.random() * 0.4); events.push({ t, type: 'box' });
  }
  if (bar >= 4 && bar % 8 !== 7 && (s === 0 || s === 8)) { kickAt(t); events.push({ t, type: 'kick' }); }   // 5小節目からキック。8小節目は抜く
}

// --- VHS（2026-11-04 slowdive から、強めた） ---
// 小さな写し（d、RGBA、w×h）を行ごとに崩す。G（0..1.5）で全部まとめて強くなる
//   1. 行を左右にずらす（テープの揺れ、トラッキングの帯の中は大きく）。roll で画面が縦に流れる
//   2. 明るさ（Y）と色（I, Q）に分ける。明るさは横に少しぼかしてから輪郭を立て、白い縁（リンギング）を出す
//   3. 色は横に大きくぼかして右へずらし、上の行とも混ぜる（色は縦の解像度も低い）
//   4. 黒を浮かせ、暖色に寄せ、ノイズを足す。R を右、B を左へずらす
//   5. 下の端はヘッドの切り替わりで右へ流してノイズで埋める。ときどき白い短い線（ドロップアウト）と、横に走るスノー
let Yr = new Float32Array(0), Ys = Yr, Ir = Yr, Qr = Yr, Ip = Yr, Qp = Yr, Rr = Yr, Br = Yr, roll = 0;
function vhs(d, w, h, G, t) {
  if (Yr.length !== w) [Yr, Ys, Ir, Qr, Ip, Qp, Rr, Br] = [0, 0, 0, 0, 0, 0, 0, 0].map(() => new Float32Array(w));
  const s = w / 270;   // 揺れやずれの量を、にじみのつまみ（写しの大きさ）によらずそろえる
  const bh = h * (0.025 + 0.05 * G), bands = [((t * 0.15) % 1.4 - 0.2) * h];
  if (G > 0.6) bands.push(((t * 0.53 + 0.4) % 1.4 - 0.2) * h);
  const snow = Math.random() < 0.04 + G * 0.1 ? Math.random() * h : -99, snowH = h * (0.005 + Math.random() * 0.02);   // 横に走るスノー
  const drops = Array.from({ length: Math.random() * (2 + G * 6) | 0 }, () => [Math.random() * h | 0, Math.random() * w | 0, (8 + Math.random() * 50) * s | 0]);   // ドロップアウト：行、始まり、長さ
  const R = Math.round((4 + G * 4) * s), CS = Math.round((3 + G * 4) * s), split = Math.round((1 + G * 3) * s), noise = 0.06 + G * 0.1;
  const RW = Math.max(2, Math.round(4 * s)), head = h * 0.94, ro = Math.round(roll), src = new Uint8ClampedArray(d);
  for (let y = 0; y < h; y++) {
    const inBand = bands.some(b => Math.abs(y - b) < bh), inSnow = Math.abs(y - snow) < snowH;
    let off = Math.sin(y * 0.05 + t * 2.3) * (0.8 + G) * s + (inBand ? (Math.random() - 0.5) * (10 + 30 * G) * s : 0);
    if (y > head) off += ((y - head) / (h - head)) ** 2 * 35 * s;
    off = Math.round(off);
    const r = y * w, sr = (((y + ro) % h) + h) % h * w;
    for (let x = 0; x < w; x++) {
      const i = (sr + Math.min(w - 1, Math.max(0, x - off))) * 4, R0 = src[i] / 255, G0 = src[i + 1] / 255, B0 = src[i + 2] / 255;
      Yr[x] = 0.299 * R0 + 0.587 * G0 + 0.114 * B0; Ir[x] = 0.596 * R0 - 0.274 * G0 - 0.322 * B0; Qr[x] = 0.211 * R0 - 0.523 * G0 + 0.312 * B0;
    }
    // 明るさ：3画素でぼかし（Ys）、RW 画素の平均との差を足して輪郭に縁を出す
    let sw = 0;
    for (let x = 0; x < w; x++) Ys[x] = (Yr[Math.max(0, x - 1)] + Yr[x] + Yr[Math.min(w - 1, x + 1)]) / 3;
    for (let x = -RW; x < w; x++) {
      sw += Ys[Math.min(w - 1, x + RW)] - (x - RW - 1 >= 0 ? Ys[x - RW - 1] : x >= 1 ? Ys[0] : 0);
      if (x >= 0) Yr[x] = Ys[x] + 0.8 * (Ys[x] - sw / Math.min(2 * RW + 1, x + RW + 1));
    }
    const n2 = (inBand || y > head) ? noise * 4 : noise;
    let si = 0, sq = 0;   // 色の移動平均（左から右へ）
    for (let x = -R; x < w; x++) {
      const a = Math.min(w - 1, Math.max(0, x + R)), b = Math.min(w - 1, Math.max(0, x - R - 1));
      si += Ir[a] - (x >= 1 ? Ir[b] : 0); sq += Qr[a] - (x >= 1 ? Qr[b] : 0);
      const X = x + CS;
      if (X < 0 || X >= w) continue;
      const n = Math.min(2 * R + 1, x + R + 1);
      let Y = 0.07 + Yr[X] * 0.86 + (Math.random() - 0.5) * n2;
      if (inSnow) Y = Math.random() * (0.4 + Math.random() * 0.6);
      const I = (si / n + Ip[X]) * 0.42, Q = (sq / n + Qp[X]) * 0.42 + (Math.random() - 0.5) * noise * 0.3;   // 上の行の色と混ぜ、色にもノイズ
      Ip[X] = si / n; Qp[X] = sq / n;
      Rr[X] = (Y + 0.956 * I + 0.621 * Q) * 255 * 1.05;
      d[(r + X) * 4 + 1] = (Y - 0.272 * I - 0.647 * Q) * 255;
      Br[X] = (Y - 1.106 * I + 1.703 * Q) * 255 * 0.92;
    }
    for (let x = 0; x < w; x++) { const o = (r + x) * 4; d[o] = Rr[Math.max(0, x - split)]; d[o + 2] = Br[Math.min(w - 1, x + split)]; }
  }
  for (const [y, x0, len] of drops) for (let x = x0; x < Math.min(w, x0 + len); x++) {
    const o = (y * w + x) * 4, v = 200 + Math.random() * 55; d[o] = d[o + 1] = d[o + 2] = v;
  }
}

// --- データモッシュ ---
// 毎コマ、新しいコマ（N）を 8px のブロックに分け、前のコマ（P）のどこから来たか（動きベクトル）を探す。
// モッシュ中は、画面に出しているコマ（mosh）をそのベクトルで動かし、N と「動かした P」の差（残差）を足す。
// キーフレームを抜いた動画と同じで、前の場面の絵が新しい場面の動きに引きずられ、輪郭が少しずつ浮かんでくる。
// hold のときは前のベクトルをくり返し、残差は足さず、下へ流れる向きを足す（bloom：画面全体が垂れて溶ける）
const MB = 8, MR = 3;
let P = null, mosh = null, VX = null, VY = null, moshUntil = 0, holdUntil = 0, flowSeed = 0;
function datamosh(d, w, h, on, hold, t) {
  const N = new Uint8ClampedArray(d);
  if (!P || P.length !== d.length) { P = N; mosh = Float32Array.from(d); return; }
  const bw = Math.ceil(w / MB), bh = Math.ceil(h / MB);
  if (!VX || VX.length !== bw * bh) { VX = new Float32Array(bw * bh); VY = new Float32Array(bw * bh); }
  if (on) {
    for (let by = 0; by < bh; by++) for (let bx = 0; bx < bw; bx++) {
      const k = by * bw + bx;
      if (hold) {   // bloom：前のベクトルに、列ごとに速さの違う下向きの流れを足す
        VY[k] = VY[k] * 0.8 - 0.2 * (0.5 + 1.2 * (0.5 + 0.5 * Math.sin(bx * 0.9 + t * 0.7)));
        VX[k] = VX[k] * 0.8 + 0.2 * Math.sin(by * 0.5 + t) * 0.8;
        continue;
      }
      let best = 1e9, bvx = 0, bvy = 0;
      for (let vy = -MR; vy <= MR; vy++) for (let vx = -MR; vx <= MR; vx++) {
        let sad = 0;
        for (let y = by * MB; y < Math.min(h, by * MB + MB); y += 2) for (let x = bx * MB; x < Math.min(w, bx * MB + MB); x += 2) {
          const sx = Math.min(w - 1, Math.max(0, x + vx)), sy = Math.min(h - 1, Math.max(0, y + vy));
          sad += Math.abs(N[(y * w + x) * 4 + 1] - P[(sy * w + sx) * 4 + 1]);
        }
        if (sad < best) { best = sad; bvx = vx; bvy = vy; }
      }
      // 前のベクトルを半分残して勢いをつけ、替わり目ごとに決めた流れ（場所でなめらかに向きが変わる）を足す。素材の動きはゆっくりで、測った動きだけでは前の絵がほとんど動かない
      const fa = Math.sin(bx * 0.35 + flowSeed) * 2 + Math.cos(by * 0.22 + flowSeed * 1.7) * 2;
      VX[k] = VX[k] * 0.5 + bvx + Math.cos(fa) * (0.2 + 0.6 * lv); VY[k] = VY[k] * 0.5 + bvy + Math.sin(fa) * (0.2 + 0.6 * lv);
    }
    const out = new Float32Array(d.length);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const k = (y / MB | 0) * bw + (x / MB | 0), o = (y * w + x) * 4;
      const sx = Math.min(w - 1, Math.max(0, Math.round(x + VX[k] * 2.2))), sy = Math.min(h - 1, Math.max(0, Math.round(y + VY[k] * 2.2))), m = (sy * w + sx) * 4;   // 動きは大げさに
      const px = Math.min(w - 1, Math.max(0, x + Math.round(VX[k]))), py = Math.min(h - 1, Math.max(0, y + Math.round(VY[k]))), q = (py * w + px) * 4;
      for (let ch = 0; ch < 3; ch++) {
        // 残差は一部だけ足して前の絵を長く残す（lv が高いほど残る）。垂れているあいだは新しいコマを少しずつ混ぜ、一色に流れきらないようにする
        out[o + ch] = hold ? mosh[m + ch] * 0.93 + N[o + ch] * 0.07 : mosh[m + ch] + (N[o + ch] - P[q + ch]) * (0.9 - 0.3 * lv);
        d[o + ch] = out[o + ch];
      }
      out[o + 3] = 255;
    }
    mosh = out;
  } else mosh.set(N);
  P = N;
}

// --- 映像 ---
// 場面の替わり目は、テープを早送りして次へ飛ぶように崩す。やり方は4つから選ぶ
//   track：トラッキングが外れて帯が暴れる / roll：画面が縦に流れる / freeze：前の場面で一瞬止まってから切り替わる
//   mosh：ディゾルブせずに切り替え、前の場面の絵を新しい場面の動きで引きずる（データモッシュ）。1〜2.4秒
// オルゴールの音でときどき短く垂れる。8小節目（キックが抜ける小節）は小節じゅう強く崩し、頭からモッシュして後半は垂れて溶ける
// モッシュのかかり具合 lv（0..1）は、5場面のひと回り（1ループ）ごとに強くなり、LOOPS ループで最初に戻る。
// lv で、替わり目がモッシュになる確率・モッシュの長さ・流れの強さ・前の絵の残りやすさ・オルゴールでかかる確率が上がる
const LOOPS = 3;
let cur = 0, prev = 0, tCut = -9, box = 0, kick = 0, gl = 0, freezeUntil = 0, drop = false, lv = 0;
function onEvent(e) {
  if (e.type === 'bar') {
    prev = cur; cur = e.bar % SCENES.length; tCut = e.t; drop = e.bar % 8 === 7;
    lv = (Math.floor(e.bar / SCENES.length) % LOOPS) / (LOOPS - 1);
    if (e.bar) {
      gl = 1;
      const k = drop || Math.random() < lv ? 'mosh' : ['track', 'roll', 'freeze'][Math.random() * 3 | 0];
      if (k === 'mosh') { tCut = e.t - 1; flowSeed = Math.random() * 100; moshUntil = e.t + (drop ? ST * 15 : 1 + 1.4 * lv); gl = 0.3; if (drop) holdUntil = moshUntil, holdFrom = e.t + ST * 6; }
      if (k === 'roll') roll = lo.height * (0.3 + Math.random() * 0.5);
      if (k === 'freeze') { freezeUntil = e.t + 0.3; tCut = freezeUntil; }
    }
  }
  if (e.type === 'box') {
    box = 1;
    if (e.t > moshUntil && Math.random() < 0.3 * lv) { moshUntil = e.t + 0.35; holdFrom = e.t; holdUntil = moshUntil; }
    if (drop && Math.random() < 0.5) roll = lo.height * (0.05 + Math.random() * 0.15);
  }
  if (e.type === 'kick') kick = 1;
}
let holdFrom = 0;
// 動画の真ん中を画面の比率で切り抜いて lctx に描く
function drawScene(i, a) {
  const v = vids[i]; if (v.readyState < 2) return;
  const k = Math.min(v.videoWidth / W, v.videoHeight / H) / (1 + kick * 0.03), sw = W * k, sh = H * k;   // キックで少し寄る
  lctx.globalAlpha = a;
  lctx.drawImage(v, (v.videoWidth - sw) / 2, (v.videoHeight - sh) / 2, sw, sh, 0, 0, lo.width, lo.height);
}
// 音の時刻が進んでいないあいだ（始める前・一時停止中）は、1コマ描いたら止めておく。
// ac.state では見ない（tools/render.py は音をコマごとに suspend しながら進める）
let still = false, lastT = -1;
function frame() {
  requestAnimationFrame(frame);
  if (still && (!ac || ac.currentTime === lastT)) return;
  lastT = ac ? ac.currentTime : -1;
  const t = ac ? ac.currentTime : performance.now() / 1000;
  while (ac && events.length && events[0].t <= t) onEvent(events.shift());
  box *= 0.9; kick *= 0.88; gl *= 0.9; roll *= 0.88;

  // にじみ：小さく描いてから拡大する。にじみのつまみが大きいほど小さく
  const r = Math.round(480 - 340 * +document.getElementById('blur').value);
  const rh = Math.round(r * H / W);
  if (lo.width !== r || lo.height !== rh) { lo.width = vh.width = r; lo.height = vh.height = rh; }
  if (t >= freezeUntil) {   // コマ止めのあいだは lo を描き替えない
    const mix = Math.max(0, Math.min(1, (t - tCut) / 0.6));   // 0.6秒のディゾルブ
    drawScene(prev, 1); drawScene(cur, mix); lctx.globalAlpha = 1;
  }
  const im = lctx.getImageData(0, 0, r, rh);
  datamosh(im.data, r, rh, t < moshUntil, t >= holdFrom && t < holdUntil, t);
  vhs(im.data, r, rh, 0.5 + gl * 1.1 + (drop ? 0.5 : 0), t);
  vctx.putImageData(im, 0, 0);

  ctx.imageSmoothingEnabled = true;
  ctx.filter = 'saturate(1.2) contrast(1.05)';
  ctx.drawImage(vh, 0, 0, W, H);
  ctx.filter = 'none';
  ctx.fillStyle = 'rgba(0,0,0,0.16)';   // 走査線
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 2);

  // 光：ぼかした写しをスクリーンで重ねる。オルゴールの音で強く
  gctx.filter = 'blur(6px)'; gctx.globalCompositeOperation = 'copy';
  gctx.drawImage(c, 0, 0, glow.width, glow.height);
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = Math.min(1, +document.getElementById('glow').value * 1.1 + box * 0.25);
  ctx.drawImage(glow, 0, 0, W, H);

  // 粒
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.14;
  ctx.save();
  ctx.translate(Math.random() * 256, Math.random() * 256);
  ctx.fillStyle = grains[Math.random() * 4 | 0]; ctx.fillRect(-256, -256, W + 512, H + 512);
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  still = vids[0].readyState >= 2;
}

document.getElementById('aspect').onchange = () => { setSize(); still = false; }; setSize();
requestAnimationFrame(frame);
document.getElementById('play').onclick = startAudio;
c.onpointerdown = startAudio;

document.getElementById('rec').onclick = e => {
  startAudio(); step = 0;
  const btn = e.target, type = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const stream = c.captureStream(30);
  audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
  const chunks = [];
  rec.ondataavailable = ev => chunks.push(ev.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(window.lastBlob = new Blob(chunks, { type }));
    a.download = `screensaver_${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`; a.click();
    btn.disabled = false; btn.textContent = '● 録画して保存';
  };
  btn.disabled = true; btn.textContent = '録画中…';
  rec.start(); setTimeout(() => rec.stop(), document.getElementById('dur').value * 1000);
};
</script>
