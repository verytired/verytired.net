<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  #panel { width: 240px; display: grid; gap: 8px; align-content: start; }
  canvas { max-width: min(100%, 720px); max-height: 90vh; background: #000; }
  button, select { font: inherit; padding: 6px; }
</style>
</head>
<body>
<div id="panel">
  <select id="aspect">
    <option value="1080x1920">9:16</option>
    <option value="1080x1080">1:1</option>
  </select>
  <button id="play">▶ 音を鳴らす</button>
  <label>録画秒数 <input type="number" id="dur" min="3" max="60" value="15"></label>
  <button id="rec">● 録画して保存</button>
</div>
<canvas id="c"></canvas>

<script>
// 画像を文字の格子に置き換える。文字の選択・行ずらし・色ずれ・ドロップアウトまで、すべてフラグメントシェーダで描く
const c = document.getElementById('c'), gl = c.getContext('webgl', { preserveDrawingBuffer: true });
const CW = 12, CH = 21;   // 1文字のマス（px）。1080 幅で 90 列
let W, H;
const setSize = () => { [W, H] = document.getElementById('aspect').value.split('x').map(Number); c.width = W; c.height = H; gl.viewport(0, 0, W, H); };
document.getElementById('aspect').onchange = setSize; setSize();

// --- 文字のアトラス ---
// 印字できる ASCII を1文字ずつ描いてインクの量を数え、少ない順に並べる。暗い所ほど細い文字、明るい所ほど @ や # になる
const chars = (() => {
  const t = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  t.canvas.width = CW; t.canvas.height = CH; t.font = '19px Menlo, monospace'; t.textBaseline = 'top'; t.fillStyle = '#fff';
  const ink = ch => { t.clearRect(0, 0, CW, CH); t.fillText(ch, 0, 1); let s = 0; const d = t.getImageData(0, 0, CW, CH).data; for (let i = 3; i < d.length; i += 4) s += d[i]; return s; };
  return ' ' + Array.from({ length: 94 }, (_, i) => String.fromCharCode(33 + i)).map(ch => [ch, ink(ch)]).sort((a, b) => a[1] - b[1]).map(a => a[0]).join('');
})();
const atlas = document.createElement('canvas'), actx = atlas.getContext('2d');
atlas.width = chars.length * CW; atlas.height = CH;
actx.font = '19px Menlo, monospace'; actx.textBaseline = 'top'; actx.fillStyle = '#fff';
[...chars].forEach((ch, i) => actx.fillText(ch, i * CW, 1));

// --- シェーダ ---
const FS = `
precision highp float;
uniform sampler2D S, F;          // 素材の画像、文字のアトラス
uniform vec2 res, cellPx, pan;
uniform vec4 box;                // 反転した矩形（x, y, w, h を px で）
uniform vec2 cursor;             // 白いカーソルのマス
uniform float N, t, dens, thr, glitch, split, flick, tile, zoom, bright, seed, big;
varying vec2 v;
float h1(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
// 画面の点 → 素材の明るさ。画像は横に tile 回並べる（元動画も同じ絵が左右に繰り返されていた）
float lum(vec2 px) {
  float tw = res.x / tile;
  vec2 q = vec2(mod(px.x, tw), px.y - res.y * 0.5) / tw + vec2(0.0, 0.5);
  q = (q - 0.5) / zoom + 0.5 + pan;
  q += 0.012 * sin(q.yx * 7.0 + t * 0.8);
  float s = 0.0;   // 4点の平均でマスの中をならす
  for (int i = 0; i < 4; i++) s += dot(texture2D(S, q + 0.006 * vec2(i == 1 ? 1.0 : i == 3 ? -1.0 : 0.0, i == 0 ? 1.0 : i == 2 ? -1.0 : 0.0)).rgb, vec3(0.299, 0.587, 0.114));
  return smoothstep(0.3, 0.8, s * 0.25) * bright;
}
// マス cell の文字の濃さ。fr はマスの中の位置（0〜1）
float glyph(vec2 cell, vec2 fr, float sc) {
  float L = lum((cell + 0.5) * cellPx * sc);
  float r = h1(cell + seed);
  if (L < thr) return r < dens * 0.04 ? texture2D(F, vec2((1.0 + floor(r * 900.0) + fr.x) / N, fr.y)).a * 0.35 : 0.0;   // 暗い所にもまばらに細い文字
  if (r > dens * (0.2 + 1.6 * L)) return 0.0;   // ドロップアウト：音が薄いほど、暗い所ほど文字が抜ける
  float j = (h1(cell + floor(t * flick) * 1.7) - 0.5) * 10.0;     // 文字のちらつき
  float idx = clamp(floor(L * 0.9 * (N - 1.0) + j), 1.0, N - 1.0);   // 一番濃い文字ばかりで埋まらないよう、上は少し残す
  return texture2D(F, vec2((idx + fr.x) / N, fr.y)).a * (0.3 + 0.7 * L);
}
void main() {
  vec2 px = v * res;
  float tq = floor(t * 24.0);
  // 一部の帯だけ文字を2倍にする
  float sc = h1(vec2(floor(px.y / (cellPx.y * 6.0)), tq + seed)) < big ? 2.0 : 1.0;
  vec2 cell = floor(px / (cellPx * sc)), fr = fract(px / (cellPx * sc));
  // 行ずらし：行ごとに乱数を引き、一部の行を「マス単位で」横へずらす。別の行の中身を持ってくることもある
  float hr = h1(vec2(cell.y, tq) + seed);
  if (hr < glitch * 0.5) cell.x += floor((fract(hr * 91.3) - 0.5) * 50.0);
  if (fract(hr * 17.1) < glitch * 0.25) cell.y += floor((fract(hr * 5.7) - 0.5) * 24.0);
  float g = glyph(cell, fr, sc);
  vec3 col = vec3(g);
  // 色ずれ：赤と青だけ数マスずれた場所の文字を読む。ずれた文字が赤や水色になって浮く
  if (split > 0.5) col = vec3(glyph(cell - vec2(split, 0.0), fr, sc), g, glyph(cell + vec2(split, 0.0), fr, sc) * 0.9 + g * 0.1);
  if (h1(cell * 1.3 + floor(t * 6.0)) < 0.03) col *= vec3(1.0, 0.35, 0.35);   // ところどころ赤い文字
  // 反転した矩形：明るいグレーの地に黒い文字
  if (px.x > box.x && px.x < box.x + box.z && px.y > box.y && px.y < box.y + box.w) col = vec3(0.78) - col * 0.8;
  // 白いカーソル
  if (floor(px / cellPx) == cursor) col = vec3(0.95);
  gl_FragColor = vec4(col, 1.0);
}`;
const VS = 'attribute vec2 a; varying vec2 v; void main() { v = a * 0.5 + 0.5; v.y = 1.0 - v.y; gl_Position = vec4(a, 0, 1); }';
const prog = gl.createProgram();
[[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, FS]].forEach(([type, src]) => {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  gl.attachShader(prog, s);
});
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = {}; ['S', 'F', 'res', 'cellPx', 'pan', 'box', 'cursor', 'N', 't', 'dens', 'thr', 'glitch', 'split', 'flick', 'tile', 'zoom', 'bright', 'seed', 'big'].forEach(k => U[k] = gl.getUniformLocation(prog, k));
gl.uniform1i(U.S, 0); gl.uniform1i(U.F, 1);

const tex = (src, repeat) => {
  const tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, repeat ? gl.LINEAR : gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, repeat ? gl.LINEAR : gl.NEAREST);
  // 素材は 512px（2の累乗）なので繰り返せる。アトラスは2の累乗ではないので端で止める
  [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(w => gl.texParameteri(gl.TEXTURE_2D, w, repeat ? gl.MIRRORED_REPEAT : gl.CLAMP_TO_EDGE));
  return tx;
};
const fontTex = tex(atlas, false);
// 素材は黒背景の白黒写真5枚（file:// でも読めるよう末尾に base64 で埋め込んである）
const texs = [];
function loadTextures() { IMGS.forEach((src, i) => { const img = new Image(); img.onload = () => texs[i] = tex(img, true); img.src = src; }); }

// --- 音 ---
// グリッチ 140BPM。8小節で1周：6小節は密なノイズとブレイク、2小節は抜き（クリックとサブだけ）。
// 鳴らす音はすべて events にも積んで、映像側がちょうどその時刻に拾う
const BPM = 140, ST = 60 / BPM / 4, events = [];
let step = 0;   // 録画のときは 0 に戻して、曲の頭から録る
let ac, an, out, audioDest, fft, noise, crush, space, echo;
function startAudio() {
  if (ac) return ac.resume();
  ac = new AudioContext();
  out = ac.createGain(); out.gain.value = 0.8;
  const lim = ac.createDynamicsCompressor(); lim.threshold.value = -6; lim.ratio.value = 12;
  out.connect(lim);
  an = ac.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.6;
  fft = new Uint8Array(an.frequencyBinCount);
  lim.connect(an); lim.connect(ac.destination); lim.connect(audioDest = ac.createMediaStreamDestination());

  // ビットクラッシュ：波形を階段にする
  crush = ac.createWaveShaper();
  crush.curve = Float32Array.from({ length: 4096 }, (_, i) => Math.round((i / 2047.5 - 1) * 5) / 5);
  const cg = ac.createGain(); cg.gain.value = 0.5; crush.connect(cg).connect(out);

  // 空間：短めのリバーブと16分のディレイ
  const ir = ac.createBuffer(2, ac.sampleRate * 1.5, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 4; }
  space = ac.createGain(); space.gain.value = 0.35;
  const rev = ac.createConvolver(); rev.buffer = ir; space.connect(rev).connect(out);
  const dly = ac.createDelay(1), fb = ac.createGain(); dly.delayTime.value = ST * 3; fb.gain.value = 0.45;
  echo = dly; dly.connect(fb).connect(dly); dly.connect(space); dly.connect(out);

  const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  noise = () => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.loopStart = Math.random(); return s; };

  let next = ac.currentTime + 0.1;
  setInterval(() => { while (next < ac.currentTime + 0.2) { play(step++, next); next += ST; } }, 25);
}
function env(t, a, dcy, peak, node) { node.gain.setValueAtTime(0, t); node.gain.linearRampToValueAtTime(peak, t + a); node.gain.exponentialRampToValueAtTime(1e-4, t + a + dcy); }
function kickAt(t, v = 1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.07);
  env(t, 0.001, 0.3, 1.2 * v, g); o.connect(g).connect(out); o.start(t); o.stop(t + 0.35);
}
// ノイズの破裂：バンドパスの位置を毎回変えて、ビットクラッシュに通す
function burstAt(t, len, v = 1) {
  const n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = 300 + Math.random() ** 2 * 8000; f.Q.value = 0.8 + Math.random() * 4;
  g.gain.setValueAtTime(0.9 * v, t); g.gain.setValueAtTime(0, t + len);   // 角を立てたまま切る
  n.connect(f).connect(g).connect(crush); n.start(t); n.stop(t + len + 0.01);
  if (Math.random() < 0.2) g.connect(echo);
}
function clickAt(t, v = 1) {
  const n = noise(), f = ac.createBiquadFilter(), g = ac.createGain(), pn = ac.createStereoPanner();
  f.type = 'highpass'; f.frequency.value = 6000; pn.pan.value = Math.random() * 2 - 1;
  env(t, 0.0005, 0.012, 0.6 * v, g); n.connect(f).connect(g).connect(pn).connect(out); pn.connect(space); n.start(t); n.stop(t + 0.03);
}
// 電子音のピッ：矩形波の短い音
function blipAt(t, freq) {
  const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = freq;
  env(t, 0.001, 0.06, 0.12, g); o.connect(g).connect(echo); g.connect(out); o.start(t); o.stop(t + 0.1);
}
// サブ：サイン波を長く鳴らし、終わりでピッチを滑らせる
function subAt(t, freq, len, to) {
  const o = ac.createOscillator(), g = ac.createGain(), sat = ac.createWaveShaper();
  sat.curve = Float32Array.from({ length: 1024 }, (_, i) => Math.tanh((i / 511.5 - 1) * 2.5));
  o.frequency.setValueAtTime(freq, t); o.frequency.setValueAtTime(freq, t + len * 0.6); o.frequency.exponentialRampToValueAtTime(to, t + len);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.35, t + 0.01); g.gain.setValueAtTime(0.35, t + len - 0.05); g.gain.linearRampToValueAtTime(0, t + len);
  o.connect(sat).connect(g).connect(out); o.start(t); o.stop(t + len);
}
let pat;
function newPattern(bar) {
  const sparse = bar % 8 >= 6;   // 8小節に2小節は抜き
  const r = () => Math.random();
  return {
    sparse,
    kicks: Array.from({ length: 16 }, (_, i) => [0, 6, 10].includes(i) || (i === 3 && r() < 0.5) || (i === 13 && r() < 0.4)),
    bursts: Array.from({ length: 16 }, (_, i) => r() < (i % 4 === 2 ? 0.8 : 0.35)),
    stutter: r() < 0.6 ? 12 + (r() * 3 | 0) : -1,   // 小節の終わりで32分の連打
    blips: Array.from({ length: 16 }, () => r() < 0.15 ? [880, 1320, 1760, 2637][r() * 4 | 0] : 0),
  };
}
function play(step, t) {
  const bar = Math.floor(step / 16), s = step % 16;
  if (s === 0) {
    pat = newPattern(bar); events.push({ t, type: 'bar', bar, sparse: pat.sparse });
    if (bar % 8 === 0) { kickAt(t, 1.3); burstAt(t, 0.4, 1.2); events.push({ t, type: 'hit' }); }   // 周の頭は強く
    if (pat.sparse && bar % 8 === 6) subAt(t, 49, ST * 30, 31);
  }
  if (pat.sparse) {   // 抜き：クリックと、ときどきのピッだけ
    if (Math.random() < 0.3) { clickAt(t, 0.5 + Math.random() * 0.5); events.push({ t, type: 'click' }); }
    if (pat.blips[s] && Math.random() < 0.4) blipAt(t, pat.blips[s]);
    return;
  }
  if (pat.kicks[s]) { kickAt(t); events.push({ t, type: 'kick' }); }
  if (pat.stutter >= 0 && s >= pat.stutter) {
    for (let k = 0; k < 2; k++) burstAt(t + k * ST / 2, ST / 2 * 0.7, 0.7 + (s - pat.stutter) * 0.1);
    events.push({ t, type: 'stut' });
  } else if (pat.bursts[s]) { burstAt(t, ST * (Math.random() < 0.3 ? 2 : 0.6)); events.push({ t, type: 'burst' }); }
  clickAt(t, s % 2 ? 0.3 : 0.6);
  if (pat.blips[s]) blipAt(t, pat.blips[s]);
}

// --- 映像 ---
// 連続的な値（文字の量・明るさ・ちらつき）は FFT の帯域から、切り替えは音のイベントから取る
const P = { img: 0, pan: [0, 0], zoom: 1.4, tile: 1.5, seed: 0, box: [0, 0, 0, 0] };
let lvl = 0.5, hi = 0, kick = 0, glitch = 0, split = 0, big = 0, sparse = 0, cursor = [-1, -1];
const pick = a => a[Math.random() * a.length | 0];
function cut() {   // 画像・位置・繰り返しを選び直す
  P.img = Math.random() * texs.length | 0;
  P.pan = [(Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3]; P.zoom = 1.1 + Math.random() * 1.4;
  P.tile = pick([1, 1.5, 1.5, 2, 2.5]); P.seed = Math.random() * 100;
  // 反転した矩形はカットの3割で出す
  P.box = Math.random() < 0.3 ? [Math.random() * W * 0.8, Math.random() * H * 0.9, (2 + Math.random() * 8 | 0) * CW, (2 + Math.random() * 5 | 0) * CH] : [0, 0, 0, 0];
}
function onEvent(e) {
  if (e.type === 'bar') { sparse = e.sparse ? 1 : 0; cut(); }
  if (e.type === 'hit') { glitch = 1; split = 3; big = 0.5; }
  if (e.type === 'kick') { kick = 1; if (Math.random() < 0.35) cut(); }
  if (e.type === 'burst') { glitch = Math.max(glitch, 0.5); if (Math.random() < 0.4) split = 1 + (Math.random() * 3 | 0); P.seed = Math.random() * 100; }
  if (e.type === 'stut') { glitch = 1; split = 2; big = 0.25; P.seed = Math.random() * 100; }
  if (e.type === 'click') { cursor = [Math.random() * W / CW | 0, Math.random() * H / CH | 0]; glitch = Math.max(glitch, 0.15); }
}
function frame(time) {
  requestAnimationFrame(frame);
  const k = time / 1000;
  while (ac && events.length && events[0].t <= ac.currentTime) onEvent(events.shift());
  if (an) {
    an.getByteFrequencyData(fft);
    const band = (a, b) => { let s = 0; for (let i = a; i < b; i++) s += fft[i]; return s / ((b - a) * 255); };
    lvl += (band(1, 120) - lvl) * 0.3; hi += (band(150, 400) - hi) * 0.3;
  }
  kick *= 0.85; glitch *= 0.82; big *= 0.8; if (glitch < 0.2) split = 0;
  if (texs.filter(Boolean).length < IMGS.length) return;   // 画像の読み込み待ち

  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texs[P.img]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fontTex);
  gl.uniform2f(U.res, W, H);
  gl.uniform2f(U.cellPx, CW, CH);
  gl.uniform1f(U.N, chars.length);
  gl.uniform1f(U.t, k);
  // 音が密なほど文字が埋まる。抜きでは大半が消える
  gl.uniform1f(U.dens, sparse ? 0.06 + lvl * 0.5 : 0.35 + lvl * 1.2 + kick * 0.2);
  gl.uniform1f(U.thr, sparse ? 0.25 : 0.1 - kick * 0.05);
  gl.uniform1f(U.bright, 0.8 + kick * 0.4);
  gl.uniform1f(U.flick, 4 + hi * 40);   // 高音が多いほど文字が速く入れ替わる
  gl.uniform1f(U.glitch, glitch);
  gl.uniform1f(U.split, split);
  gl.uniform1f(U.big, big);
  gl.uniform1f(U.tile, P.tile);
  gl.uniform1f(U.zoom, P.zoom * (1 + kick * 0.08));
  gl.uniform2f(U.pan, P.pan[0] + Math.sin(k * 0.3) * 0.03, P.pan[1]);
  gl.uniform1f(U.seed, P.seed);
  gl.uniform4f(U.box, ...P.box);
  const blink = Math.floor(k * 4) % 2;
  gl.uniform2f(U.cursor, blink ? cursor[0] : -1, cursor[1]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(frame);

document.getElementById('play').onclick = startAudio;
c.onpointerdown = startAudio;

document.getElementById('rec').onclick = e => {
  startAudio(); step = 0;
  const btn = e.target, type = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const stream = c.captureStream(30);
  audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
  const chunks = [];
  rec.ondataavailable = ev => chunks.push(ev.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(window.lastBlob = new Blob(chunks, { type }));
    a.download = `ascii_${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`; a.click();
    btn.disabled = false; btn.textContent = '● 録画して保存';
  };
  btn.disabled = true; btn.textContent = '録画中…';
  rec.start(); setTimeout(() => rec.stop(), document.getElementById('dur').value * 1000);
