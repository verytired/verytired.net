<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neo-Yankee</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=block">
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; box-sizing: border-box; min-height: 100vh; }
  #panel { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  canvas { max-width: min(100%, 720px); max-height: calc(100vh - 90px); background: #000; }
  button, select { font: inherit; padding: 6px; }
  video { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <select id="aspect">
    <option value="1080x1920">9:16</option>
    <option value="1080x1350">4:5</option>
    <option value="1080x1080">1:1</option>
  </select>
  <button id="play">▶ 音を鳴らす</button>
  <label>録画秒数 <input type="number" id="dur" min="3" max="240" value="30"></label>
  <button id="rec">● 録画して保存</button>
</div>
<video src="src/neo-yankee_src.mp4" muted loop playsinline preload="auto"></video>

<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.umd.min.js"></script>
<script>
// 平成のヤンキー文化を原宿の色で盛った5場面（109 前のヤンキー座り、パステルの暴走族、デコトラ、デコチャリ、集会）を、
// 128 BPM のテクノでつなぐ15秒のループ（8小節）。
// 人と乗り物は緑の前で撮った動画から抜いて、立体のブロック・輪切りの線・そのままで見せ、背景は前のコマを溶かして引きずるデータモッシュで崩す
const BPM = 128, BEAT = 60 / BPM, ST = BEAT / 4, STEPS = 256, LOOP = STEPS * ST;   // 16小節で LOOP = 30秒ちょうど
const SCN = [0, 64, 96, 128, 192, 256];   // 場面の頭（16分のステップ）：4・2・2・4・4 小節
const WORDS = ['夜露死苦', '全開', '仏恥義理', '喧嘩上等', '天上天下唯我独尊'];
// ブラウザで触れるパラメータ（既定は書き出しの値）。[見出し, キー, 名前, 最小, 最大, 刻み, 既定] か、選択肢 [キー, 名前, 選択肢, 既定]
const PRM_SPEC = [
  ['ループ', 'auto', 'ループごとに値を変える', 0, 1, 1, 1],
  ['人', 'mode', '見せ方', ['ランダム（小節ごと）', 'そのまま', 'ブロック', '横の輪切り', '縦の輪切り', '場面ごと'], 0],
  [null, 'raw', 'アクセントで素の人', 0, 1, 1, 1],
  ['カメラ', 'orbit', '回る量', 0, 4, 0.05, 0.8],   // 回りすぎると裏側（座標がない）が見えて半分に割れる
  [null, 'push', '寄る量', 0, 2, 0.05, 0.6],
  [null, 'sway', '傾きの揺れ', 0, 0.3, 0.01, 0.06],
  ['人', 'scratch', '動画を前後に揺らす（秒）', 0, 2, 0.05, 0.8],
  [null, 'ghost', '元の人を透かす', 0, 1, 0.05, 0.45],
  [null, 'dist', '距離', 1.5, 6, 0.05, 3.4],
  [null, 'pitch', '見下ろし', -0.6, 0.6, 0.02, 0.18],
  ['ブロック', 'csz', '大きさ', 0.2, 2, 0.05, 1],
  [null, 'cglow', '光る割合', 0, 1, 0.01, 0.12],
  [null, 'cmove', 'ブロックそれぞれの動き', 0, 3, 0.05, 1],
  [null, 'cflow', '流体の動き', 0, 3, 0.05, 1],
  [null, 'scat0', '飛ぶ量（ふだん）', 0, 16, 0.5, 2],
  [null, 'scatH', '飛ぶ量（打撃）', 0, 16, 0.5, 8],
  [null, 'bloom', 'にじみ', 0, 0.6, 0.01, 0.12],
  ['線', 'lbr', '明るさ', 0, 3, 0.05, 1.3],
  [null, 'llen', '長さ', 0.2, 4, 0.05, 1],
  [null, 'lst', '飛ぶ筋の量（打撃）', 0, 1, 0.01, 0.15],
  [null, 'lgap', '輪切りの間隔（行）', 1, 10, 1, 2],
  [null, 'lrand', '間隔と太さのランダムさ', 0, 1, 0.05, 1],
  [null, 'lw', '線の太さ（px）', 1, 16, 0.5, 5],
  [null, 'lglow', '線のにじみ', 0, 0.6, 0.01, 0.2],
  [null, 'rain', '縦の雨', 0, 1, 1, 0],
  ['変化', 'neon', '小節ごとにネオン1色', 0, 1, 1, 1],
  [null, 'flash', '線が光ってすぐ消える', 0, 1, 0.05, 0.5],
  [null, 'wglitch', '白いグリッチ（アクセント）', 0, 1, 0.05, 1],
  [null, 'scrib', '白い走り書き', 0, 1, 1, 1],
  [null, 'stars', '星（ブロック）', 0, 1, 1, 1],
  ['全体', 'pmosh', '人も崩す（打撃）', 0, 2, 0.05, 1],
  [null, 'slice', '横の帯ずらし（アクセント）', 0, 2, 0.05, 1],
  [null, 'invert', '反転（1つおきのアクセント）', 0, 1, 1, 1],
  ['背景', 'mosh0', '崩し（ふだん）', 0, 0.9, 0.01, 0.4],
  [null, 'bgB', '明るさ（ブロック）', 0, 1, 0.01, 0.75],
  [null, 'bgL', '明るさ（線）', 0, 1, 0.01, 0.7],
  [null, 'bgNeon', '背景を人と同じネオンに', 0, 1, 0.05, 0.85],
  [null, 'pal', '4色に落とす', 0, 1, 0.01, 0.6],
  [null, 'grade', '全体に同じ4色', 0, 1, 0.01, 0.15],
];
const PRM = {};
// ループごとの値（auto のとき、ループの頭で既定の値にこれを重ねる）。1周目は既定のまま
const PRESETS = [
  {},
  { csz: 1.5, cglow: 0.25, scat0: 4, scatH: 14, bloom: 0.25 },   // ブロックを大きく、よく光って、よく飛ぶ
  { lw: 10, flash: 0.9, lglow: 0.35, cflow: 2 },   // 輪切りを太く強く明滅、ブロックはよく流れる
  { mosh0: 0.7, pal: 0.9, pmosh: 1.8, slice: 1.6 },   // 場面ごとで強く崩す
];
// ブロックと線の色：小節ごとに、このネオンの色から1色に切り替える（参考の、色がぱっと変わるところ）
const NEON = ['#29e3ff', '#3dff6b', '#a14bff', '#ffd21f', '#ff3fd2', '#3b6bff', '#ff7a1f'].map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255));
// パラメータのパネル（lil-gui）。見出しごとにフォルダにし、0/1 だけの項目はチェックボックスにする
{ const gui = new lil.GUI({ title: 'パラメータ', width: 300 }), folders = {}; let fold = gui;
  for (const e of PRM_SPEC) {
    if (e[0]) fold = folders[e[0]] ||= gui.addFolder(e[0]);   // 同じ見出しは1つのフォルダにまとめる
    if (Array.isArray(e[3])) { PRM[e[1]] = e[4]; fold.add(PRM, e[1], Object.fromEntries(e[3].map((t, i) => [t, i]))).name(e[2]); continue; }
    const [, k, name, mn, mx, st, df] = e;
    if (mn === 0 && mx === 1 && st === 1) { PRM[k] = !!df; fold.add(PRM, k).name(name); }
    else { PRM[k] = df; fold.add(PRM, k, mn, mx, st).name(name); }
  }
  const DEF = { ...PRM };
  window.setPreset = i => { Object.assign(PRM, DEF, { auto: PRM.auto }, PRESETS[i % PRESETS.length]); gui.controllersRecursive().forEach(c => c.updateDisplay()); };
  gui.add({ copy: () => navigator.clipboard.writeText(JSON.stringify(PRM)) }, 'copy').name('今の値をコピー');
  if (window !== top) gui.hide();   // サイトの player.html に埋め込まれているときは隠す（作品の上に重なる）
}
const vid = document.querySelector('video');   // 5場面をつないだ15秒（src/prep.sh で作る）
// 動画は一度だけ全部メモリに読み込んでから使う。簡易サーバー（python -m http.server）は途中から読む指定（Range）に応えないので、
// 再生位置を飛ばすたびに頭から読み直しになり、コマが届かずに止まった（ブラウザで1つの場面しか映らなかった）
let vidReady = false;
// サイト（verytired.net）ではスマホ（タッチの端末）向けの軽い版 .sp.mp4 があるので、先にそちらを試し、無ければ元の動画を読む
const vsrc = vid.getAttribute('src'), touch = matchMedia('(pointer: coarse)').matches;
(touch ? fetch(vsrc.replace(/\.mp4$/, '.sp.mp4')).then(r => r.ok ? r : fetch(vsrc)) : fetch(vsrc)).then(r => r.blob()).then(b => { vid.src = URL.createObjectURL(b); vid.addEventListener('loadeddata', () => { vidReady = true; if (ac) vid.play(); }, { once: true }); vid.load(); });

// ---- 譜面：音も映像もここから読む ----
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(21);
// 128 BPM のテクノ、16小節。頭から全部鳴らし、16小節目でブレイク。4つ打ちのキック、裏の開いたハット、16分の閉じたハット、2・4拍目のクラップ。
// キックの間を転がるベース（16分の2・3・4つ目）と、キックの後ろの暗い響き（ランブル）。デコトラからアシッド、デコチャリからダブの和音。
// 最後の小節は3拍目でキックを抜き、クラップを詰めて頭へ戻る
const ACID = [[45, 1, 0], [45, 0, 0], [57, 1, 1], [45, 0, 0], [48, 0, 0], [45, 1, 0], [55, 0, 1], [52, 0, 0],
  [45, 1, 0], [45, 0, 0], [60, 1, 1], [57, 0, 0], [45, 0, 0], [50, 1, 0], [48, 0, 1], [45, 0, 0]];   // [音, アクセント, 次へ滑る]
const CH = [[57, 60, 64, 67]];   // Am7（ダブの和音）
const EV = [], VS = new Array(STEPS).fill(0);   // VS：そのステップで映す動画の位置（ステップ）
const secOf = s => SCN.findIndex((x, i) => s >= x && s < SCN[i + 1]);
for (let bar = 0; bar < 16; bar++) {
  const b0 = bar * 16, sec = secOf(b0), T = b0 * ST, last8 = bar === 15;
  if (b0 === SCN[sec]) EV.push({ t: T, type: 'crash' }, { t: T, type: 'word', v: sec }, { t: T, type: 'acc' });
  if (bar === 4) EV.push({ t: T, type: 'rev', v: 0.45 });   // 暴走族のコール（空ぶかし）
  for (let s = 0; s < 16; s++) {
    VS[b0 + s] = b0 + s;
    const t = T + s * ST, beat = s >> 2, q = s & 3, drop = last8 && beat >= 2;
    if (q === 0 && !drop) EV.push({ t, type: 'kick', v: 1 }, { t: t + 0.01, type: 'rumble' });
    if (q !== 0 && !drop) EV.push({ t, type: 'bass', v: q === 2 ? 45 : 33, a: q === 2 ? 1 : 0.7 });
    EV.push({ t, type: 'hat', v: q === 2 ? 1 : 0.45, open: q === 2 && !drop });
    if ((s === 4 || s === 12) && !drop) EV.push({ t, type: 'snare', v: 1 });   // クラップ（映像は「スネア」として拾う）
    if (!drop) { const [n, ac_, sl] = ACID[s]; EV.push({ t, type: 'acid', v: n, a: ac_, sl, cut: 0.55 + 0.45 * (bar % 8) / 7 }); }   // アシッドは頭から開けておき、8小節ごとにさらに開く（閉じた所から始めると、シンセが鳴っていないように聞こえた）
  }
  if (bar % 2 === 1 && !last8) EV.push({ t: T + 12 * ST, type: 'acc' });   // 2小節ごとの最後のクラップがアクセント
  if (bar % 8 === 7 && !last8) { for (let k = 0; k < 4; k++) EV.push({ t: T + (14 + k * 0.5) * ST, type: 'snare', v: 0.7 }); EV.push({ t: T + 14 * ST, type: 'stut' }); }
  if (!last8) for (const s of [3, 10]) EV.push({ t: T + s * ST, type: 'stab', v: 0 });
  if (last8) {   // 最後の小節：3拍目からキックを抜き、クラップを 8分→16分→32分で詰めて、ノイズを上げる
    EV.push({ t: T + 8 * ST, type: 'riser' }, { t: T + 8 * ST, type: 'pad', v: 0, d: 8 * ST });
    for (let x = 8; x < 16;) { EV.push({ t: T + x * ST, type: 'snare', v: 0.6 + (x - 8) * 0.05 }); x += x < 12 ? 2 : x < 14 ? 1 : 0.5; }
    EV.push({ t: T + 15 * ST, type: 'acc' });
  }
}
EV.sort((a, b) => a.t - b.t);
const last = (tl, type) => { let x = -99; for (const e of EV) { if (e.t > tl) break; if (e.type === type) x = e.t; } return x; };
const lastEv = (tl, type) => { let x = null; for (const e of EV) { if (e.t > tl) break; if (e.type === type) x = e; } return x; };
const mtof = m => 440 * 2 ** ((m - 69) / 12);

// ---- 音 ----
let ac = null, t0 = 0, out, drums, syn, duck, verb, noiseBuf, nextEv = 0, loopN = 0;
function audio() {
  if (ac) return;
  vid.play();
  ac = new AudioContext();
  const master = ac.createDynamicsCompressor(); master.threshold.value = -10; master.ratio.value = 8; master.attack.value = 0.002; master.release.value = 0.08;
  const lim = ac.createWaveShaper(); lim.curve = new Float32Array(1024).map((_, i) => Math.tanh(1.4 * (i / 511.5 - 1)) / Math.tanh(1.4));
  const post = ac.createGain(); post.gain.value = 0.45;   // 書き出しで −14 LUFS 前後
  out = ac.createGain(); out.gain.value = 0.9; out.connect(master); master.connect(lim); lim.connect(post); post.connect(ac.destination);
  window.audioDest = ac.createMediaStreamDestination ? ac.createMediaStreamDestination() : null;
  if (audioDest) post.connect(audioDest);
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // ハットとクラップは少しビットを落として歪ませる。短い部屋の響きを少し
  const crush = ac.createWaveShaper(); crush.curve = new Float32Array(4096).map((_, i) => Math.round((i / 2047.5 - 1) * 64) / 64);
  const dist = ac.createWaveShaper(); dist.curve = new Float32Array(1024).map((_, i) => Math.tanh(1.8 * (i / 511.5 - 1)));
  const dc = ac.createDynamicsCompressor(); dc.threshold.value = -18; dc.ratio.value = 6; dc.attack.value = 0.001;
  const dg = ac.createGain(); dg.gain.value = 0.45;
  drums = ac.createGain(); drums.connect(crush); crush.connect(dist); dist.connect(dc); dc.connect(dg); dg.connect(out);
  const L = ac.sampleRate * 0.5, ir = ac.createBuffer(2, L, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const x = ir.getChannelData(ch); for (let i = 0; i < L; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / L, 3); }
  const room = ac.createConvolver(); room.buffer = ir; const rg = ac.createGain(); rg.gain.value = 0.25; drums.connect(room); room.connect(rg); rg.connect(out);
  // 上もの：キックで音量を下げる（ポンプ）。長い残響
  const L2 = ac.sampleRate * 2.5, ir2 = ac.createBuffer(2, L2, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const x = ir2.getChannelData(ch); for (let i = 0; i < L2; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / L2, 4); }
  verb = ac.createConvolver(); verb.buffer = ir2;
  duck = ac.createGain(); syn = ac.createGain(); syn.gain.value = 0.5;
  syn.connect(duck); const vg = ac.createGain(); vg.gain.value = 0.35; syn.connect(verb); verb.connect(vg); vg.connect(duck); duck.connect(out);
  t0 = ac.currentTime + 0.05;
  setInterval(schedule, 25); schedule();
}
function schedule() {   // 0.2秒先まで鳴らしておく。ループの頭で譜面を読み直す
  for (;;) {
    if (nextEv >= EV.length) { nextEv = 0; loopN++; }
    const e = EV[nextEv], t = t0 + loopN * LOOP + e.t;
    if (t > ac.currentTime + 0.2) break;
    nextEv++;
    if (t < ac.currentTime - 0.05) continue;
    const f = SND[e.type]; if (f) f(t, e);
  }
}
function noise(t, len) { const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true; n.start(t, Math.random()); n.stop(t + len); return n; }
function env(g, t, peak, a, dcy) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(1e-4, t + a + dcy); }
const SND = {
  kick(t, e) {   // テクノのキック：胴が落ちていく正弦波と、短いクリック。上ものとベースはキックで下げる
    const o = ac.createOscillator(), g = ac.createGain(), sh = ac.createWaveShaper();
    sh.curve = new Float32Array(1024).map((_, i) => Math.tanh(1.6 * (i / 511.5 - 1)));
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.09);
    g.gain.setValueAtTime(e.v, t); g.gain.setValueAtTime(e.v, t + 0.06); g.gain.exponentialRampToValueAtTime(1e-4, t + 0.42);
    o.connect(sh); sh.connect(g); g.connect(out); o.start(t); o.stop(t + 0.45);
    const n = noise(t, 0.01), f = ac.createBiquadFilter(), ng = ac.createGain(); f.type = 'highpass'; f.frequency.value = 3000; env(ng, t, 0.3, 0.0005, 0.008); n.connect(f); f.connect(ng); ng.connect(out);
    duck.gain.setValueAtTime(0.15, t); duck.gain.setTargetAtTime(1, t + 0.03, 0.07);
  },
  rumble(t) {   // キックの後ろの暗い響き：低いノイズを長い残響に送る
    const n = noise(t, 0.3), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'lowpass'; f.frequency.value = 140; f.Q.value = 4;
    env(g, t, 0.9, 0.01, 0.25); n.connect(f); f.connect(g); g.connect(verb); g.connect(duck);
  },
  bass(t, e) {   // 転がるベース：短いノコギリを低く。キックで下げる
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = mtof(e.v);
    f.type = 'lowpass'; f.Q.value = 3; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(180, t + 0.08);
    env(g, t, 0.5 * e.a, 0.002, 0.09); o.connect(f); f.connect(g); g.connect(duck); o.start(t); o.stop(t + 0.12);
  },
  hat(t, e) {
    const n = noise(t, e.open ? 0.25 : 0.05), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'highpass'; f.frequency.value = e.open ? 7000 : 9000;
    env(g, t, (e.open ? 0.28 : 0.16) * e.v, 0.001, e.open ? 0.2 : 0.035); n.connect(f); f.connect(g); g.connect(drums);
  },
  snare(t, e) {   // クラップ：帯域を絞ったノイズを3回ずらして叩き、残響へ
    const f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 1.2; f.connect(g); g.connect(drums); g.connect(verb);
    for (const d of [0, 0.011, 0.022]) { const n = noise(t + d, 0.02), ng = ac.createGain(); env(ng, t + d, 0.9 * e.v, 0.0005, d === 0.022 ? 0.18 : 0.012); n.connect(ng); ng.connect(f); }
  },
  acid(t, e) {   // アシッド（303 風）：ノコギリを鋭いローパスに通し、アクセントでフィルターを開く。滑る音は次の音へ音程を引きずる
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(), sh = ac.createWaveShaper(); o.type = 'sawtooth';
    sh.curve = new Float32Array(1024).map((_, i) => Math.tanh(2.5 * (i / 511.5 - 1)));
    o.frequency.setValueAtTime(mtof(e.v), t); f.type = 'lowpass'; f.Q.value = 14;
    const top = 300 + 2600 * e.cut * (e.a ? 1.6 : 1); f.frequency.setValueAtTime(top, t); f.frequency.exponentialRampToValueAtTime(220, t + (e.a ? 0.18 : 0.1));
    const len = e.sl ? ST * 1.05 : ST * 0.7; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(e.a ? 0.32 : 0.2, t + 0.003); g.gain.setValueAtTime(e.a ? 0.32 : 0.2, t + len * 0.8); g.gain.linearRampToValueAtTime(0, t + len);
    o.connect(f); f.connect(sh); sh.connect(g); g.connect(duck); o.start(t); o.stop(t + len + 0.01);
  },
  stab(t, e) { saw(t, CH[e.v], 0.1, 0.08); },

  gl.uniform1ui(P_MOSH.u('seedS'), Math.floor(Math.max(last(tl, 'rev'), last(tl, 'stut')) * 100 + step * (sec === 1 ? 1 : 0)) >>> 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3); cur = 1 - cur;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(P_POST);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, nx.t); gl.uniform1i(P_POST.u('acc'), 0);
  gl.uniform2f(P_POST.u('res'), W, H); gl.uniform1f(P_POST.u('S'), S);
  gl.uniform3fv(P_POST.u('P'), PALS.flat()); gl.uniform1i(P_POST.u('sec'), sec);
  gl.uniform1ui(P_POST.u('seedB'), Math.floor(last(tl, 'snare') * 10) >>> 0);
  gl.uniform1f(P_POST.u('mix5'), chop ? 0.6 : 0.35);
  gl.uniform1f(P_POST.u('pal'), Math.min(1, PRM.pal + 0.4 * aHit + 0.3 * wHit));
  gl.uniform1f(P_POST.u('ca'), 3 + 30 * kHit + 20 * stHit + 25 * roll);
  gl.uniform1f(P_POST.u('inv'), (roll > 0.5 && sHit > 0.5) || (chop && stHit > 0.7) || (PRM.invert && aHit > 0.55 && Math.round(last(tl, 'acc') / ST / 16) % 2) ? 1 : 0);
  gl.uniform1f(P_POST.u('slc'), PRM.slice * Math.max(aHit, 0.5 * stHit));
  gl.uniform1f(P_POST.u('pix'), chop && aHit > 0.5 ? 10 : roll > 0.75 ? 18 : 1);
  gl.uniform1f(P_POST.u('grain'), 0.08 + 0.1 * kHit);
  gl.uniform1f(P_POST.u('glow'), 0.6 + 0.8 * kHit);
  gl.uniform1f(P_POST.u('bgDim'), (vox ? (vox === 2 ? PRM.bgL : PRM.bgB) : 0.6) + 0.3 * aHit);
  gl.uniform3f(P_POST.u('neon'), ...nt); gl.uniform1f(P_POST.u('nmix'), vox && PRM.neon ? PRM.bgNeon : 0);
  gl.uniform1f(P_POST.u('grade'), vox ? PRM.grade * 0.3 : PRM.grade);
  gl.uniform1f(P_POST.u('wg'), vox ? PRM.wglitch * aHit : 0); gl.uniform1ui(P_POST.u('gseed'), Math.floor(last(tl, 'acc') * 100) >>> 0);
  gl.uniform1f(P_POST.u('stars'), vox === 1 && PRM.stars ? 1 : 0);
  gl.uniform1f(P_POST.u('rain'), vox === 2 && PRM.rain ? 1 : 0); gl.uniform1f(P_POST.u('tsec'), tl);
  gl.uniform1f(P_POST.u('fgKeep'), raw ? 1 : 0.85);   // 人にもアクセントで場面の色を落とす
  gl.uniform1ui(P_POST.u('seed'), ++frameN);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

document.getElementById('rec').onclick = e => {
  audio();
  const btn = e.target, type = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const stream = c.captureStream(30);
  audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
  const chunks = [];
  rec.ondataavailable = ev => chunks.push(ev.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = `neo-yankee_${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`; a.click();
    btn.disabled = false; btn.textContent = '● 録画して保存';
  };
  btn.disabled = true; btn.textContent = '録画中…';
  rec.start(); setTimeout(() => rec.stop(), document.getElementById('dur').value * 1000);
};
