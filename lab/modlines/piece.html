<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modulation Lines</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  #panel { width: 240px; display: grid; gap: 8px; align-content: start; }
  canvas { max-width: min(100%, 720px); max-height: 90vh; background: #000; }
  button, select { font: inherit; padding: 6px; }
</style>
</head>
<body>
<div id="panel">
  <select id="aspect">
    <option value="1080x1350">4:5</option>
    <option value="1080x1920">9:16</option>
    <option value="1080x1080">1:1</option>
  </select>
  <button id="play">▶ 音を鳴らす</button>
  <label>録画秒数 <input type="number" id="dur" min="3" max="60" value="22"></label>
  <button id="rec">● 録画して保存</button>
</div>
<canvas id="c"></canvas>

<script>
// 写真をディザの粗い画素か、明るさで波打つ横線に置き換え、4色のパレットで塗って光らせる。DJ Krush「Kemuri」風の曲でつまみを動かす
const c = document.getElementById('c'), ctx = c.getContext('2d');
const small = document.createElement('canvas'), sctx = small.getContext('2d');   // ディザの画素を1マス1ピクセルで描く
const glow = document.createElement('canvas'), gctx = glow.getContext('2d');     // 光：縮小してぼかした写し
const photos = [];
let W, H, cur = 0, lum = null, LW = 0, LH = 0;   // lum: 写真の明るさ（0..1）を LW×LH の格子に縮めたもの
const setSize = () => {
  [W, H] = document.getElementById('aspect').value.split('x').map(Number);
  c.width = W; c.height = H; glow.width = W / 4; glow.height = H / 4;
  sample();
};
// 写真を画面いっぱいに切り抜いて、3px 四方ごとの明るさにする。ディザも線もここから読む
function sample() {
  const im = photos[cur];
  if (!W || !im || !im.complete) return;
  LW = W / 3 | 0; LH = H / 3 | 0;
  const o = document.createElement('canvas'); o.width = LW; o.height = LH;
  const a = o.getContext('2d'), s = Math.max(LW / im.width, LH / im.height);
  a.drawImage(im, (LW - im.width * s) / 2, (LH - im.height * s) / 2, im.width * s, im.height * s);
  const d = a.getImageData(0, 0, LW, LH).data;
  lum = new Float32Array(LW * LH);
  for (let i = 0; i < lum.length; i++) lum[i] = (d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11) / 255;
  // 写真ごとの明るさをならす：明るいほうから2%の値を 1 に合わせる
  const top = Float32Array.from(lum).sort()[lum.length * 0.98 | 0] || 1;
  for (let i = 0; i < lum.length; i++) lum[i] = Math.min(1, lum[i] / top);
}
// 明るさの読み出し。gain と mid で明るさと中間調を動かす（Dither Boy の Brightness / Midtones にあたる）
const look = (x, y) => lum[Math.min(LH - 1, y | 0) * LW + Math.min(LW - 1, x | 0)];
const tone = (v, gain, mid) => Math.min(1, Math.max(0, v * gain) ** mid);

// --- パレット ---
// 暗い順に4色。いちばん暗い色が地
const PALETTES = [
  ['#06061a', '#2a4bd7', '#5aa8ff', '#eaf6ff'],   // bubblegum の青
  ['#120800', '#7a2e00', '#ff8a1f', '#ffe2b0'],   // 琥珀
  ['#05110a', '#1f6f3a', '#7cff6b', '#f2ffe0'],   // 燐光
  ['#140010', '#8a1f6b', '#ff5fb8', '#ffe6f4'],   // ローズ
];
let pal = 0;
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

// --- ディザ（Sierra Lite） ---
// 1マス cell px の格子に縮め、4段階に丸める。丸めた誤差を右に 2/4、左下と下に 1/4 ずつ配る
let err = new Float32Array(0);
function dither(cell, gain, mid, jitter) {
  const cw = Math.ceil(W / cell), chh = Math.ceil(H / cell);
  if (small.width !== cw || small.height !== chh) { small.width = cw; small.height = chh; }
  if (err.length < (cw + 2) * (chh + 1)) err = new Float32Array((cw + 2) * (chh + 1));
  err.fill(0);
  const img = sctx.createImageData(cw, chh), px = img.data, cols = PALETTES[pal].map(rgb), k = cell / 3;
  for (let y = 0; y < chh; y++) for (let x = 0; x < cw; x++) {
    const e = (y * (cw + 2)) + x + 1;
    const v = tone(look(x * k, y * k), gain, mid) + (Math.random() - 0.5) * jitter + err[e];
    const q = Math.min(3, Math.max(0, Math.round(v * 3))), d = v - q / 3;
    err[e + 1] += d / 2; err[e + cw + 1] += d / 4; err[e + cw + 2] += d / 4;
    const p = (y * cw + x) * 4;
    [px[p], px[p + 1], px[p + 2]] = cols[q]; px[p + 3] = 255;
  }
  sctx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(small, 0, 0, cw * cell, chh * cell);
  // マスの境目に細い地の線を引き、画素の粒を見せる
  if (cell >= 8) {
    ctx.fillStyle = PALETTES[pal][0]; ctx.globalAlpha = 0.5;
    for (let x = 0; x < W; x += cell) ctx.fillRect(x, 0, 1, H);
    for (let y = 0; y < H; y += cell) ctx.fillRect(0, y, W, 1);
    ctx.globalAlpha = 1;
  }
}

// --- 線（Modulation Lines） ---
// gap px おきに横線を引き、明るいところほど細かく大きく波打たせる。暗いところは線を切り、ところどころに粒を置く
function lines(gap, gain, mid, t, amp, wob, bands) {
  const P = PALETTES[pal];
  ctx.fillStyle = P[0]; ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 2; ctx.lineJoin = 'round';
  for (const [lv, col] of [[0.12, P[1]], [0.5, P[2]], [0.8, P[3]]]) {   // 明るさの段ごとに色を替えて重ねる
    ctx.strokeStyle = col; ctx.beginPath();
    for (let r = 0, y0 = gap / 2; y0 < H; r++, y0 += gap) {
      let off = Math.sin(r * 0.21 + t * 0.7) * wob;   // テープの揺れで行ごとに左右へ
      for (const b of bands) if (r >= b.r0 && r < b.r1) off += b.dx;   // グリッチ：何行かをまとめてずらす
      const f = 0.35 + 0.25 * Math.sin(r * 0.37 + t * 0.3), ph = t * 4 + r * 1.7;
      let pen = false;
      for (let x = 0; x < W; x += 3) {
        const v = tone(look((x - off) / 3, y0 / 3), gain, mid);
        if (v < lv) { pen = false; continue; }
        const y = y0 + Math.sin(x * f + ph) * v * amp * gap * 0.5;
        pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y); pen = true;
      }
    }
    ctx.stroke();
  }
  // 暗いところの粒。位置は行と列で決め、時間で瞬かせる
  ctx.fillStyle = P[2];
  const tt = t * 6 | 0;
  for (let y0 = gap / 2; y0 < H; y0 += gap) for (let x = 0; x < W; x += 12) {
    const v = tone(look(x / 3, y0 / 3), gain, mid);
    if (v > 0.04 && v < 0.3 && hash(x, y0, tt) < v * 1.6) ctx.fillRect(x - 1.5, y0 - 1.5, 3, 3);
  }
}
const hash = (a, b, c) => { const s = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453; return s - Math.floor(s); };

// --- 光（Epsilon Glow にあたる） ---
// 画面を 1/4 に縮めてぼかし、足し算で重ねる
function bloom(strength) {
  gctx.filter = 'blur(6px)'; gctx.globalCompositeOperation = 'copy';
  gctx.drawImage(c, 0, 0, glow.width, glow.height);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = strength;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(glow, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

// --- 音 ---
// 90BPM の DJ Krush「Kemuri」風。煙のように暗いアブストラクト・ヒップホップ。
// 重くざらついたブーンバップ、深いサブベース、低く沈むマイナーのパッド、尺八のような息まじりの笛、ときどきスクラッチ、レコードのプチ音
// テープの揺れ（ワウ）は弱くして残し、映像の揺れと合わせる
const BPM = 90, ST = 60 / BPM / 4, events = [];
let step = 0;   // 録画のときは 0 に戻して、曲の頭から録る
let ac, out, audioDest, wow, wowT0 = 0, drums, echo, room, noiseBuf;
const mtof = m => 440 * 2 ** ((m - 69) / 12);
function startAudio() {
  if (ac) return ac.resume();
  ac = new AudioContext();
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
  const sat = ac.createWaveShaper(); sat.curve = Float32Array.from({ length: 1024 }, (_, i) => Math.tanh((i / 511.5 - 1) * 2) / Math.tanh(2));
  out = ac.createGain(); out.gain.value = 0.7;
  out.connect(sat).connect(lp).connect(comp);
  comp.connect(ac.destination); comp.connect(audioDest = ac.createMediaStreamDestination());

  // ワウ（0.33Hz、±8セント）とフラッター（5.7Hz、±2セント）。BoC よりずっと弱く
  wow = ac.createGain();
  for (const [f, d] of [[0.33, 8], [5.7, 2]]) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.value = d; o.connect(g).connect(wow); o.start(); }
  wowT0 = ac.currentTime;

  // 笛とスクラッチ用のディレイ（付点8分）
  echo = ac.createDelay(2); echo.delayTime.value = ST * 3;
  const fb = ac.createGain(); fb.gain.value = 0.45;
  const ef = ac.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 1600;
  echo.connect(ef).connect(fb).connect(echo); ef.connect(out);

  // 煙：2.5秒の暗いリバーブ
  const ir = ac.createBuffer(2, ac.sampleRate * 2.5, ac.sampleRate);
  for (let k = 0; k < 2; k++) { const d = ir.getChannelData(k); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 3; }
  room = ac.createGain(); room.gain.value = 0.35;
  const rv = ac.createConvolver(), rf = ac.createBiquadFilter(); rv.buffer = ir; rf.type = 'lowpass'; rf.frequency.value = 2500;
  room.connect(rv).connect(rf).connect(out);

  // ビート：ビットを落としてざらつかせ、こもらせる（サンプラーで鳴らしたブレイクの感じ）
  const crush = ac.createWaveShaper(); crush.curve = Float32Array.from({ length: 4096 }, (_, i) => Math.round((i / 2047.5 - 1) * 24) / 24);
  drums = ac.createGain();
  const dl = ac.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 3200;
  drums.connect(crush).connect(dl).connect(out);

  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const hiss = noise(), hf = ac.createBiquadFilter(), hg = ac.createGain();
  hf.type = 'bandpass'; hf.frequency.value = 3000; hf.Q.value = 0.5; hg.gain.value = 0.018;
  hiss.connect(hf).connect(hg).connect(out); hiss.start();

  let next = ac.currentTime + 0.1;
  setInterval(() => { while (next < ac.currentTime + 0.2) { play(step++, next); next += ST; } }, 25);
}
const noise = () => { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.loopStart = Math.random(); return s; };
function env(g, t, a, hold, rel, v) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.setValueAtTime(v, t + a + hold); g.gain.linearRampToValueAtTime(0, t + a + hold + rel); }
// パッド：低く沈む三角波2本。ローパスを閉じ気味にして、リバーブに多めに送る
function padAt(t, midi, len) {
  const f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'lowpass'; f.frequency.setValueAtTime(350, t); f.frequency.linearRampToValueAtTime(700, t + len * 0.5); f.frequency.linearRampToValueAtTime(350, t + len);
  env(g, t, 1.2, len - 1.2, 1.5, 0.045);
  f.connect(g); g.connect(out); g.connect(room);
  for (const [d, type] of [[-6, 'triangle'], [7, 'sawtooth']]) {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = mtof(midi); o.detune.value = d;
    wow.connect(o.detune); o.connect(f); o.start(t); o.stop(t + len + 1.6);
  }
}
// サブベース：サイン波。軽く歪ませて小さいスピーカーでも聞こえるようにする
function bassAt(t, midi, len) {
  const o = ac.createOscillator(), g = ac.createGain(), sh = ac.createWaveShaper();
  sh.curve = Float32Array.from({ length: 256 }, (_, i) => Math.tanh((i / 127.5 - 1) * 3));
  o.frequency.value = mtof(midi); wow.connect(o.detune);
  env(g, t, 0.01, len, 0.25, 0.4); o.connect(sh).connect(g).connect(out); o.start(t); o.stop(t + len + 0.3);
}
// 笛（尺八風）：サイン波に揺れ（ビブラート）をかけ、下からしゃくり上げて入る。息の音を帯域ノイズで重ねる
function fluteAt(t, midi, len) {
  const o = ac.createOscillator(), vib = ac.createOscillator(), vg = ac.createGain(), g = ac.createGain();
  o.frequency.value = mtof(midi); o.detune.setValueAtTime(-120, t); o.detune.linearRampToValueAtTime(0, t + 0.18);   // しゃくり
  vib.frequency.value = 5; vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(18, t + len * 0.6);       // 後から揺れが深くなる
  vib.connect(vg).connect(o.detune);
  env(g, t, 0.12, len * 0.6, len * 0.4, 0.08);
  o.connect(g); g.connect(out); g.connect(echo); g.connect(room);
  const n = noise(), bf = ac.createBiquadFilter(), ng = ac.createGain();
  bf.type = 'bandpass'; bf.frequency.value = mtof(midi) * 2; bf.Q.value = 3;
  env(ng, t, 0.05, len * 0.3, len * 0.5, 0.06);
  n.connect(bf).connect(ng); ng.connect(out); ng.connect(room);
  for (const x of [o, vib, n]) { x.start(t); x.stop(t + len + 0.1); }
}
function kickAt(t, v = 1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.1);
  g.gain.setValueAtTime(1.2 * v, t); g.gain.exponentialRampToValueAtTime(1e-4, t + 0.5);
  o.connect(g).connect(drums); o.start(t); o.stop(t + 0.55);
  const n = noise(), cg = ac.createGain();   // 頭のクリック
  cg.gain.setValueAtTime(0.4 * v, t); cg.gain.exponentialRampToValueAtTime(1e-4, t + 0.01);
  n.connect(cg).connect(drums); n.start(t); n.stop(t + 0.02);
}
// スネア：太い胴（三角波）と、長めのノイズ。リバーブに少し送る
function snareAt(t, v = 1) {
  const n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.6;
  g.gain.setValueAtTime(0.75 * v, t); g.gain.exponentialRampToValueAtTime(1e-4, t + 0.28);
  n.connect(f).connect(g); g.connect(drums); g.connect(room); n.start(t); n.stop(t + 0.3);
  const o = ac.createOscillator(), og = ac.createGain(); o.type = 'triangle';
  o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.06);
  og.gain.setValueAtTime(0.5 * v, t); og.gain.exponentialRampToValueAtTime(1e-4, t + 0.12); o.connect(og).connect(drums); o.start(t); o.stop(t + 0.15);
}
function hatAt(t, v) {
  const n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'highpass'; f.frequency.value = 7000;
  g.gain.setValueAtTime(0.1 * v, t); g.gain.exponentialRampToValueAtTime(1e-4, t + 0.035);
  n.connect(f).connect(g).connect(drums); n.start(t); n.stop(t + 0.05);
}
// スクラッチ：ノイズを帯域フィルターに通し、中心の周波数を往復させる（レコードを前後にこする）
function scratchAt(t, strokes) {
  const n = noise(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'bandpass'; f.Q.value = 6;
  const d = ST * 0.9;
  for (let i = 0; i < strokes; i++) {
    const t0 = t + i * d, up = i % 2 === 0;
    f.frequency.setValueAtTime(up ? 400 : 2400, t0); f.frequency.exponentialRampToValueAtTime(up ? 2400 : 400, t0 + d * 0.8);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.5, t0 + 0.01); g.gain.setValueAtTime(0.5, t0 + d * 0.7); g.gain.linearRampToValueAtTime(0, t0 + d * 0.85);
  }
  n.connect(f).connect(g); g.connect(out); g.connect(echo); n.start(t); n.stop(t + strokes * d + 0.05);
}
// レコードのプチ音：2ms のノイズ
function crackleAt(t) {
  const n = noise(), g = ac.createGain();
  g.gain.setValueAtTime(0.12 + Math.random() * 0.15, t); g.gain.exponentialRampToValueAtTime(1e-4, t + 0.002 + Math.random() * 0.004);
  n.connect(g).connect(out); n.start(t); n.stop(t + 0.01);
}
// 4小節のコード：Dm9 Dm9 B♭maj7 A7sus4。低い音域で鳴らす
const CHORDS = [[38, 45, 53, 57, 64], [38, 45, 53, 57, 64], [34, 41, 50, 57, 62], [33, 40, 50, 55, 59]];
const FLUTE = [62, 65, 67, 69, 72, 74];   // D のマイナー・ペンタトニック（D F G A C D）
function play(step, t) {
  const bar = Math.floor(step / 16), s = step % 16, b4 = bar % 4, ch = CHORDS[b4];
  const sw = s % 2 ? ST * 0.22 : 0;   // 裏の16分を遅らせて、重くもたれさせる
  if (s === 0) {
    for (const m of ch.slice(1)) padAt(t, m + 12, ST * 16);
    events.push({ t, type: 'bar', bar });
  }
  const root = ch[0];
  if (s === 0) bassAt(t, root, ST * 6); if (s === 10) bassAt(t + sw, root, ST * 3); if (s === 14 && b4 === 3) bassAt(t, root + 12, ST * 2);
  const drop = bar % 8 === 7;   // 8小節目はビートを抜いて、笛とスクラッチだけにする
  if (!drop) {
    // ブーンバップ：1拍目と2拍目の裏のキック、2・4拍目のスネア
    if (s === 0 || s === 7 || s === 10 || (s === 15 && Math.random() < 0.4)) { kickAt(t + sw, s === 0 ? 1 : 0.8); events.push({ t: t + sw, type: 'kick' }); }
    if (s === 4 || s === 12) { snareAt(t + sw); events.push({ t: t + sw, type: 'snare' }); }
    if (s % 2 === 0) hatAt(t + sw, s % 4 === 2 ? 1 : 0.6); else if (Math.random() < 0.2) hatAt(t + sw, 0.35);
  }
  // 笛：2小節に1度、長い音を1〜2つ
  if (bar % 2 === 1 && (s === 2 || (s === 10 && Math.random() < 0.6))) {
    fluteAt(t, FLUTE[Math.random() * FLUTE.length | 0], ST * (s === 2 ? 7 : 5)); events.push({ t, type: 'bell' });
  }
  // スクラッチ：4小節目の終わりと、抜きの小節
  if ((b4 === 3 && s === 12) || (drop && s === 4)) { scratchAt(t, drop ? 6 : 4); events.push({ t, type: 'scratch' }); }
  if (Math.random() < 0.35) { crackleAt(t + Math.random() * ST); events.push({ t, type: 'crackle' }); }
}

// --- 映像 ---
// 4小節ごとに写真・パレット・描き方（ディザ／線）を替える。つまみは音で動かす
let mode = 0, kick = 0, snare = 0, bell = 0, crackle = 0, flash = 0;
const bands = [];   // グリッチでずらす行の帯
function onEvent(e) {
  if (e.type === 'bar' && e.bar % 4 === 0) {
    const k = e.bar / 4;
    cur = k % photos.length; pal = k % PALETTES.length; mode = k % 2; sample(); flash = 1;
    for (let i = 0; i < 6; i++) bands.push(band(40));
  }
  if (e.type === 'kick') kick = 1;
  if (e.type === 'snare' || e.type === 'scratch') { snare = 1; bands.push(band(12)); }
  if (e.type === 'bell') bell = 1;
  if (e.type === 'crackle') crackle = 1;
}
const band = n => { const r0 = Math.random() * H / 9 | 0; return { r0, r1: r0 + 1 + (Math.random() * n | 0), dx: (Math.random() - 0.5) * 120, life: 3 + (Math.random() * 8 | 0) }; };
function frame() {
  requestAnimationFrame(frame);
  while (ac && events.length && events[0].t <= ac.currentTime) onEvent(events.shift());
  if (!lum) return;
  kick *= 0.88; snare *= 0.85; bell *= 0.95; crackle *= 0.7; flash *= 0.85;
  const t = ac ? ac.currentTime : performance.now() / 1000;
  const w = ac ? Math.sin(2 * Math.PI * 0.33 * (t - wowT0)) : 0;   // 音のワウと同じ揺れ
  // 明るさは揺れとキックで、中間調はベルで動かす
  const gain = 1 + w * 0.12 + kick * 0.35, mid = 0.95 - bell * 0.3;
  if (mode === 0) {
    // 画素の大きさ：揺れに合わせてゆっくり 7〜13px を行き来し、キックで一瞬粗くなる
    dither(Math.round(10 + w * 3 + kick * 8), gain, mid, 0.05 + crackle * 0.25);
  } else {
    lines(9, gain, mid, t, 1.1 + kick * 1.2, 6 + Math.abs(w) * 10, bands);
  }
  for (let i = bands.length - 1; i >= 0; i--) if (--bands[i].life <= 0) bands.splice(i, 1);
  bloom(0.75 + kick * 0.5 + flash);
}

  const stream = c.captureStream(30);
  audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
  const chunks = [];
  rec.ondataavailable = ev => chunks.push(ev.data);
  rec.onstop = () => {
    const a = document.createElement('a');

};
